<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
:root{
  --bg:#1e1e2e;--sb:#313244;--in:#181825;--tx:#cdd6f4;--tx3:#6c7086;
  --on:#a6e3a1;--off:#45475a;--acc:#89b4fa;--bdr:#45475a;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;}
html,body{overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);width:100%;height:100%;}
.barra{background:var(--sb);padding:8px 10px;display:flex;align-items:center;gap:8px;cursor:move;}
.titulo{font-size:12px;font-weight:600;color:var(--tx);flex:1;}
.pontos{display:flex;gap:5px;margin-right:4px;}
.pt{width:11px;height:11px;border-radius:50%;background:var(--off);transition:background .25s;display:inline-block;}
.pt.on{background:var(--on);box-shadow:0 0 5px rgba(166,227,161,.55);}
.mini{font-size:11px;line-height:1;padding:3px 7px;border:1px solid var(--bdr);border-radius:3px;
  background:transparent;color:var(--tx3);cursor:pointer;}
.mini:hover{color:var(--tx);}
.corpo{padding:12px 14px;display:flex;flex-direction:column;gap:10px;}
.linha{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--tx3);}
.rotulo{width:78px;}
select{flex:1;font-size:11px;background:var(--in);color:var(--tx);border:1px solid var(--bdr);
  border-radius:3px;padding:3px 6px;outline:none;}
select:focus{border-color:var(--acc);}
button#btnVoz{font-size:11px;padding:5px 10px;border:1px solid var(--bdr);border-radius:4px;
  background:var(--in);color:var(--tx);cursor:pointer;width:110px;}
button#btnVoz.on{background:#1d3a26;border-color:var(--on);color:var(--on);}
.linhaBotoes{display:flex;gap:8px;align-items:center;}
button#btnParar{font-size:11px;padding:5px 10px;border:1px solid var(--bdr);border-radius:4px;
  background:transparent;color:var(--tx3);cursor:pointer;width:110px;}
button#btnParar.falando{background:#3a1d1d;border-color:#f38ba8;color:#f38ba8;
  box-shadow:0 0 6px rgba(243,139,168,.4);}
.fala{font-size:10px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  max-height:14px;line-height:14px;}
.fala.ativa{color:var(--acc);}
.pill{font-size:10px;line-height:1;padding:4px 9px;border-radius:9px;border:1px solid var(--bdr);
  color:var(--tx3);min-width:64px;text-align:center;}
.pill.ouvindo{color:var(--on);border-color:var(--on);}
.pill.pensando{color:#f9e2af;border-color:#f9e2af;}
.pill.falando{color:var(--acc);border-color:var(--acc);}
.pill.erro{color:#f38ba8;border-color:#f38ba8;}
.barraMic{flex:1;height:6px;background:var(--in);border-radius:3px;overflow:hidden;
  border:1px solid var(--bdr);}
#nivel{height:100%;width:0%;background:linear-gradient(90deg,var(--on),var(--acc));
  transition:width .18s linear;}
.voce{font-size:10px;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  max-height:14px;line-height:14px;}
.erroVivo{font-size:10px;color:#f38ba8;background:rgba(243,139,168,.08);
  border:1px solid rgba(243,139,168,.5);border-radius:4px;padding:4px 8px;display:none;}
</style>
</head>
<body>
<div class="barra">
  <span class="titulo">Edge</span>
  <span class="pontos">
    <i class="pt" id="ptNarr" title="Narrador"></i>
    <i class="pt" id="ptTts" title="TTS"></i>
    <i class="pt" id="ptBridge" title="Bridge"></i>
  </span>
  <button class="mini" onclick="pywebview.api.minimize()">&#8211;</button>
  <button class="mini" onclick="pywebview.api.close()">&#10005;</button>
</div>
<div class="corpo">
  <div class="linha">
    <span class="rotulo">Volume TTS</span>
    <select id="volume">
      <option value="0">0%</option><option value="30">30%</option>
      <option value="50">50%</option><option value="70">70%</option>
      <option value="80">80%</option><option value="100">100%</option>
    </select>
  </div>
  <div class="linha">
    <span class="rotulo">Timer sono</span>
    <select id="sleep">
      <option value="0">Desativado</option><option value="5">5 min</option>
      <option value="15">15 min</option><option value="30">30 min</option>
      <option value="60">60 min</option>
    </select>
  </div>
  <div class="linhaBotoes">
    <button id="btnVoz">Ligar voz</button>
    <button id="btnParar" title="Interromper fala">&#9632; Parar</button>
  </div>
  <div class="linha">
    <span class="rotulo">Estado</span>
    <span class="pill" id="pillEstado">parado</span>
    <span class="rotulo" style="width:28px;">Mic</span>
    <div class="barraMic"><div id="nivel"></div></div>
  </div>
  <div class="voce" id="linhaVoce"></div>
  <div class="fala" id="linhaFala"></div>
  <div class="erroVivo" id="linhaErro"></div>
</div>
<script>
function edgeAtualizar(st){
  document.getElementById('ptNarr').classList.toggle('on', !!st.narr);
  document.getElementById('ptTts').classList.toggle('on', !!st.tts);
  document.getElementById('ptBridge').classList.toggle('on', !!st.bridge);
  var b = document.getElementById('btnVoz');
  b.classList.toggle('on', !!st.voz);
  b.textContent = st.voz ? '\u25CF Voz ligada' : 'Ligar voz';
  var p = document.getElementById('btnParar');
  p.classList.toggle('falando', !!st.falando);
  var v = st.vivo || {};
  var nomes = {ouvindo:'Ouvindo', pensando:'Pensando', falando:'Falando',
               erro:'Erro', iniciando:'Iniciando'};
  var pe = document.getElementById('pillEstado');
  pe.textContent = nomes[v.estado] || 'Parado';
  pe.className = 'pill ' + (v.estado || 'parado');
  document.getElementById('nivel').style.width =
    Math.round(Math.min(1, v.rms || 0) * 100) + '%';
  var lv = document.getElementById('linhaVoce');
  lv.textContent = v.voce ? 'Voc\u00ea: ' + v.voce : '';
  var le = document.getElementById('linhaErro');
  if (v.erro){ le.textContent = v.erro; le.style.display = 'block'; }
  else { le.style.display = 'none'; }
  var f = document.getElementById('linhaFala');
  if (st.falando && st.texto){
    f.textContent = '\u25B6 ' + st.texto;
    f.classList.add('ativa');
  } else {
    f.textContent = st.ultima_fala || '';
    f.classList.remove('ativa');
  }
}
window.addEventListener('pywebviewready', async function(){
  try{
    var st = await window.pywebview.api.status();
    edgeAtualizar(st);
    document.getElementById('volume').value = st.volume;
    document.getElementById('sleep').value = st.sleep;
  }catch(e){}
  document.getElementById('volume').addEventListener('change', function(e){
    window.pywebview.api.set_volume(e.target.value);
  });
  document.getElementById('sleep').addEventListener('change', function(e){
    window.pywebview.api.set_sleep(e.target.value);
  });
  document.getElementById('btnVoz').addEventListener('click', async function(){
    try{
      var r = await window.pywebview.api.voice_toggle();
      edgeAtualizar({voz: r.voz});
    }catch(e){}
  });
  document.getElementById('btnParar').addEventListener('click', function(){
    try{ window.pywebview.api.parar(); }catch(e){}
  });
});
</script>
</body>
</html>
