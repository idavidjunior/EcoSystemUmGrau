<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
:root{
  --bg:#0b0e14;--tx:#cdd6f4;--tx3:#6c7086;--acc:#89b4fa;
  --on:#a6e3a1;--bdr:#45475a;--sb:#181825;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
  font-family:'Segoe UI',system-ui,sans-serif;color:var(--tx);}
#topo{position:fixed;top:0;left:0;right:0;height:30px;display:flex;
  align-items:center;gap:8px;padding:0 8px;background:linear-gradient(
  180deg,rgba(24,24,37,.92),rgba(24,24,37,.55));backdrop-filter:blur(6px);
  border-bottom:1px solid rgba(69,71,90,.5);z-index:10;}
#titulo{font-size:11px;font-weight:600;letter-spacing:.4px;flex:1;color:var(--tx);}
#titulo b{color:var(--acc);}
.mini{font-size:11px;line-height:1;padding:3px 7px;border:1px solid var(--bdr);
  border-radius:3px;background:transparent;color:var(--tx3);cursor:pointer;}
.mini:hover{color:var(--tx);}
canvas{position:fixed;inset:0;display:block;cursor:grab;}
canvas.girando{cursor:grabbing;}
#info{position:fixed;left:10px;bottom:8px;font-size:10px;color:var(--tx3);
  z-index:10;text-shadow:0 1px 2px #000;}
#hover{position:fixed;display:none;z-index:20;pointer-events:none;max-width:240px;
  background:rgba(24,24,37,.95);border:1px solid var(--bdr);border-radius:5px;
  padding:6px 9px;font-size:11px;color:var(--tx);box-shadow:0 4px 14px rgba(0,0,0,.5);}
#hover .cl{font-size:9px;margin-top:2px;}
.painel{position:fixed;top:34px;right:8px;width:200px;background:rgba(17,17,27,.97);
  border:1px solid var(--bdr);border-radius:6px;padding:10px;z-index:15;display:none;
  box-shadow:0 10px 26px rgba(0,0,0,.55);font-size:11px;}
.ptitulo{font-size:10px;color:var(--tx3);text-transform:uppercase;
  letter-spacing:.6px;margin-bottom:6px;}
.linha{display:flex;justify-content:space-between;color:var(--tx);margin-top:6px;}
input[type=range]{width:100%;accent-color:var(--acc);margin:2px 0 8px;}
.foco-btn{display:flex;justify-content:space-between;width:100%;margin:2px 0;
  padding:4px 7px;border:1px solid var(--bdr);border-radius:4px;background:transparent;
  color:var(--tx);font-size:11px;cursor:pointer;text-align:left;font-family:inherit;}
.foco-btn:hover{border-color:var(--acc);}
.foco-btn.on{border-color:var(--acc);color:var(--acc);background:rgba(137,180,250,.12);}
.foco-btn span{color:var(--tx3);}
#listaFoco{max-height:320px;overflow-y:auto;}
#barraInfo{position:fixed;left:8px;right:8px;bottom:8px;height:26px;display:none;
  align-items:center;gap:6px;padding:0 8px;background:rgba(13,14,22,.82);
  border:1px solid var(--bdr);border-radius:4px;backdrop-filter:blur(6px);
  font-size:11px;cursor:pointer;z-index:16;}
#barraInfo .cor{width:8px;height:8px;border-radius:50%;flex:none;}
#barraTitulo{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:var(--tx);}
#barraMeta{color:var(--tx3);font-size:10px;white-space:nowrap;}
#painelInfo{left:8px;bottom:40px;width:300px;max-height:calc(72vh - 56px);
  overflow-y:auto;background:rgba(13,14,22,.9);backdrop-filter:blur(6px);}
#infoTitulo{font-size:12px;color:var(--tx);font-weight:600;margin-bottom:2px;
  word-break:break-word;padding-right:20px;}
#infoX{position:absolute;top:8px;right:8px;}
.info-meta{font-size:10px;color:var(--tx3);margin-top:3px;}
.info-sum{font-size:11px;color:var(--tx);margin-top:8px;line-height:1.45;
  white-space:pre-wrap;word-break:break-word;}
.info-tags{font-size:10px;color:var(--acc);margin-top:8px;line-height:1.5;
  word-break:break-word;}
.info-fp{font-size:9px;color:var(--tx3);margin-top:8px;word-break:break-all;}
.info-viz{max-height:160px;overflow-y:auto;margin-top:2px;}
</style>
</head>
<body>
<div id="topo" class="pywebview-drag-region">
  <span id="titulo">C&#233;rebro <b>Vivo</b></span>
  <button class="mini" id="btFoco">Foco</button>
  <button class="mini" id="btAjustes">Ajustes</button>
  <button class="mini" id="btCentro">Centro</button>
  <button class="mini" id="btTopo">Fundo</button>
  <button class="mini" onclick="pywebview.api.minimizar()">&#8211;</button>
  <button class="mini" onclick="pywebview.api.fechar()">&#10005;</button>
</div>
<canvas id="cv"></canvas>
<div id="info"></div>
<div id="hover"></div>
<div id="painelAjustes" class="painel">
  <div class="ptitulo">Ajustes</div>
  <label class="linha">Foco do brilho <span id="valFoco"></span></label>
  <input id="rgFoco" type="range" min="-1" max="1" step="0.01">
  <label class="linha">Vivacidade das cores <span id="valViva"></span></label>
  <input id="rgViva" type="range" min="0" max="1" step="0.05">
  <button id="btDecor" class="foco-btn">Pulsos decorativos <span id="estDecor"></span></button>
  <label class="linha">Velocidade do movimento <span id="valMov"></span></label>
  <input id="rgMov" type="range" min="0" max="1" step="0.01">
  <label class="linha">Velocidade da rotação <span id="valRot"></span></label>
  <input id="rgRot" type="range" min="0" max="1" step="0.01">
</div>
<div id="painelFoco" class="painel">
  <div class="ptitulo">Mostrar apenas</div>
  <div id="listaFoco"></div>
</div>
<div id="painelInfo" class="painel">
  <div id="infoTitulo"></div>
  <div id="infoBody"></div>
</div>
<div id="barraInfo">
  <span class="cor" id="barraCor"></span>
  <span id="barraTitulo"></span>
  <span id="barraMeta"></span>
  <button class="mini" id="barraToggle" title="Expandir/recolher">&#9656;</button>
  <button class="mini" id="barraX" title="Fechar">&#10005;</button>
</div>
<script>
'use strict';
window.onerror = function(msg, src, linha){
  try{
    document.getElementById('info').textContent =
      'ERRO JS: ' + msg + ' @' + linha;
  }catch(e){}
  return false;
};
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const info = document.getElementById('info');
const hov = document.getElementById('hover');

const PALETA = {
  padroes:'#f9e2af', decisoes:'#a6e3a1', bugs:'#f38ba8', cognitivo:'#89b4fa',
  heuristicas:'#fab387', frameworks:'#b4befe', missoes:'#cba6f7',
  hub:'#94e2d5', geral:'#9399b2', android:'#89dceb', internet:'#74c7ec',
  traducao:'#f5c2e7', programacao:'#eed49f', mp3player:'#ee99a0', composio:'#fccde5'
};
const EXTRA = ['#f5c2e7','#89dceb','#74c7ec','#94e2d5','#eed49f','#ee99a0',
               '#a6e3a1','#fab387'];
const FORTE = {padroes:'#ffd866',decisoes:'#5efc82',bugs:'#ff5370',
  cognitivo:'#4da6ff',heuristicas:'#ff9e40',frameworks:'#8b9dff',
  missoes:'#c77dff',hub:'#35e0c8',geral:'#aab2d0',android:'#33f0ff',
  internet:'#38c6ff',traducao:'#ff7edb',programacao:'#ffe066',
  mp3player:'#ff8ba0',composio:'#ffb3d9'};
const EXTRA_FORTE = ['#ff7edb','#33f0ff','#38c6ff','#35e0c8','#ffe066',
                     '#ff8ba0','#5efc82','#ff9e40'];
const COR_CACHE = {};

function mistura(a,b,t){
  const pa=parseInt(a.slice(1),16), pb=parseInt(b.slice(1),16);
  const r=Math.round(((pa>>16)&255)+((((pb>>16)&255)-((pa>>16)&255))*t));
  const g=Math.round(((pa>>8)&255)+((((pb>>8)&255)-((pa>>8)&255))*t));
  const bl=Math.round((pa&255)+(((pb&255)-(pa&255))*t));
  return '#'+((1<<24)|(r<<16)|(g<<8)|bl).toString(16).slice(1);
}

function corDe(cl){
  const t=AJUSTES.viva;
  let base, forte;
  if (PALETA[cl]){
    base=PALETA[cl]; forte=FORTE[cl]||base;
  } else {
    let h=0;
    for (let i=0;i<cl.length;i++) h=(h*31+cl.charCodeAt(i))>>>0;
    base=EXTRA[h%EXTRA.length]; forte=EXTRA_FORTE[h%EXTRA_FORTE.length];
  }
  if (t<=0) return base;
  const chave=cl+'|'+t.toFixed(2);
  if (COR_CACHE[chave]) return COR_CACHE[chave];
  const c=mistura(base,forte,t);
  COR_CACHE[chave]=c;
  return c;
}

// ---------- estado ----------
let NOS = [];                    // {id,l,cl,g,a,x,y,z, cx,cy,cz, nasce}
let MAPA = new Map();            // id -> no
let ARESTAS = [];                // [i,j] indices em NOS
let PULSOS = [];                 // {e, t, v, tr} tr=pulso de evento real
let INCIDENCIA = null;           // indice no -> arestas incidentes
let RINGS = [];                  // aneis de cognicao {i, t} (atividade real)
let PARTICULAS = [];             // particulas luminosas do disparo {x,y,vx,vy,cor,tam,vida,nac}
let HALOS = [];                  // halos destacados do disparo {i,t,cor,int}
let GERACAO = 0;                 // versao dos dados (invalida timers de cascata)
let FLASH_TMR = null;            // timer do aviso temporario na linha info
let ATIVOS = new Map();          // indice -> ts(ms) do ultimo uso real da nota
let ECO_FALANDO = false;         // Eco falando agora (dialogo_vivo.json)
let ULT_BATIDA = 0;              // ts da ultima batida do heartbeat de voz
let FALA_ROT = 0;                // cursor rotativo pelas sementes de fala
const JANELA_USO = 600000;       // 10 min: validade do "uso recente"

// ---------- telemetria Jarvis (eventos reais -> regioes do grafo) ----------
const BVC = { amp:0.42, velPulso:3.2, subida:3.4, descida:1.1,
              hops:[1.0,0.72,0.50,0.32,0.18], sementeMax:8,
              frenteMax:400, ondaMs:520 };
const JREG = {
  fala:['voz','tts','audio','dialogo','fala','speech','microfone'],
  memoria:['memoria','aprendizado','conhecimento'],
  busca:['busca','pesquisa','search','web'],
  ferramenta:['script','adb','android','ler','daemon'],
  resposta:['cognicao','raciocinio','opencode']
};
let JARVIS = {};        // tipo -> {t0(ms), i}
let JALVO = null;       // Float32Array alvo por no
let JCUR = null;        // Float32Array corrente (fade suave)
let JADJ = null;        // adjacencia por indice
let JSEEDS = {};        // tipo -> indices sementes (cache)
let JULT_ONDA = 0;

let EXCITA = null;               // Float32Array por no
let sprites = {};                // chave cor+foco -> canvas
let AJUSTES = {foco:0.55, viva:0.65, decor:true, movimento:0.65, rotacao:0.6};
try{ Object.assign(AJUSTES,
  JSON.parse(localStorage.getItem('cerebroAjustes')||'{}')); }catch(e){}
function salvarAjustes(){
  try{ localStorage.setItem('cerebroAjustes',JSON.stringify(AJUSTES)); }catch(e){}
  try{ if (window.pywebview && pywebview.api && pywebview.api.salvar_ajustes)
    pywebview.api.salvar_ajustes(JSON.stringify(AJUSTES)); }catch(e){}
}

// ===== STATE PERSISTENCE (camera, filters, movimento, rotacao) =====
const STATE_API = 'http://localhost:8766/api/ecow/state';

async function salvarEstado(){
  const estado = {
    camera: { rotY, rotX, zoom, panX, panY },
    filtros: { filtro: FILTRO },
    ajustes: { foco: AJUSTES.foco, viva: AJUSTES.viva, decor: AJUSTES.decor,
               movimento: AJUSTES.movimento, rotacao: AJUSTES.rotacao }
  };
  try {
    await fetch(STATE_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ state: estado })
    });
  } catch (e) { /* silencioso */ }
}

async function carregarEstado(){
  try {
    const resp = await fetch(STATE_API);
    if (resp.ok) {
      const data = await resp.json();
      const s = data.state || {};
      if (s.camera) { rotY=s.camera.rotY||0.6; rotX=s.camera.rotX||-0.18;
        zoom=s.camera.zoom||1; panX=s.camera.panX||0; panY=s.camera.panY||0;
        alvoZoom=zoom; alvoPanX=panX; alvoPanY=panY; }
      if (s.filtros) { FILTRO=s.filtros.filtro||null; }
      if (s.ajustes) { Object.assign(AJUSTES, s.ajustes); }
    }
  } catch (e) { /* silencioso */ }
}

// Auto-save a cada 5s
setInterval(salvarEstado, 5000);
// Carrega estado no boot
carregarEstado();
let FILTRO = null;               // cluster ativo no painel Foco (ou null)
let VIS = null;                  // Uint8Array: 1 = no visivel
let ARVIS = [];                  // arestas entre nos visiveis
let rotY = 0.6, rotX = -0.18, velY = 0.0042, velX = 0;
let zoom = 1.0, alvoZoom = 1.0;
let panX = 0, panY = 0, alvoPanX = 0, alvoPanY = 0, emPan = false;
let pausaGiroAte = 0, cliqueNoX = 0, cliqueNoY = 0;
let arrastando = false, mx0 = 0, my0 = 0, ultToque = 0;
let mouseMX = -999, mouseMY = -999, hoverId = -1;
let selNo = -1, selViz = new Set();   // no selecionado e vizinhos diretos
let RAMO_ATIVO = new Set(), RAMO_DESDE = 0;  // ramificacao brilhando por 16s
let W = 0, H = 0, T0 = performance.now();

function hashFase(s){
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return (h % 1000) / 1000 * Math.PI * 2;
}

function sprite(cor){
  const chave = cor+'|'+AJUSTES.foco.toFixed(2);
  if (sprites[chave]) return sprites[chave];
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const g = c.getContext('2d');
  const k = Math.max(-1, Math.min(1, AJUSTES.foco));
  const kr = Math.max(0, k);                 // positivo: brilho normal (0..1)
  const kn = Math.max(0, -k);                // negativo: afina o brilho (0..1)
  const alfa = Math.round((0x66 - 0x33*kr) * (1 - 0.75*kn)).toString(16).padStart(2,'0');
  const grad = g.createRadialGradient(32,32,0, 32,32,32);
  grad.addColorStop(0,'#ffffff');
  grad.addColorStop((0.14+0.12*kr-0.12*kn).toFixed(3),cor);
  grad.addColorStop((0.30+0.22*kr-0.30*kn).toFixed(3),cor+alfa);
  grad.addColorStop(Math.min(0.98,(0.55+0.43*kr-0.55*kn).toFixed(3)),'rgba(0,0,0,0)');
  g.fillStyle = grad;
  g.fillRect(0,0,64,64);
  sprites[chave] = c;
  return c;
}

function redimensionar(){
  W = cv.width = window.innerWidth * devicePixelRatio;
  H = cv.height = window.innerHeight * devicePixelRatio;
  cv.style.width = window.innerWidth + 'px';
  cv.style.height = window.innerHeight + 'px';
}
window.addEventListener('resize', redimensionar);
redimensionar();

// ---------- carga de dados ----------
function centroidVizinhos(id){
  // vizinhos ainda desconhecidos nascem perto do centro
  return [0,0,0];
}
window.cerebroCarregar = function(dados){
  const antigos = MAPA;
  const novosNos = [];
  const novoMapa = new Map();
  for (const d of dados.nos){
    const ant = antigos.get(d.id);
    const no = {
      id:d.id, l:d.l, cl:d.cl, g:d.g, a:(d.a==null?0.5:d.a),
      x:d.x, y:d.y, z:d.z, tm:(d.tm||0),
      cx: ant ? ant.cx : d.x, cy: ant ? ant.cy : d.y, cz: ant ? ant.cz : d.z,
      nasce: ant ? 1 : 0, fase: hashFase(d.id)
    };
    novoMapa.set(d.id, no);
    novosNos.push(no);
  }
  const idx = new Map();
  novosNos.forEach((n,i)=>idx.set(n.id,i));
  const novasAr = [];
  for (const [a,b] of dados.ar){
    const i = idx.get(a), j = idx.get(b);
    if (i!=null && j!=null) novasAr.push([i,j]);
  }
  NOS = novosNos; MAPA = novoMapa; ARESTAS = novasAr;
  INCIDENCIA = null;
  JADJ = null; JSEEDS = {};
  if (Object.keys(JARVIS).length) recalcularJarvis();
  EXCITA = new Float32Array(NOS.length);
  PULSOS = [];
  RINGS = [];
  PARTICULAS = [];
  HALOS = [];
  GERACAO++;
  ATIVOS.clear();
  ECO_FALANDO = false;
  const hubs = [...NOS].sort((p,q)=>q.g-p.g).slice(0,16).map(n=>n.id);
  window.__hubs = new Set(hubs);
  SET_FALA = null;
  for (const k in AREA_FALA_CACHE) delete AREA_FALA_CACHE[k];
  FALA_AREA_IDX = 0; FALA_AREA_ULT = 0;
  if (FILTRO && !FILTRO.startsWith('__') && !NOS.some(n=>n.cl===FILTRO)) FILTRO=null;
  atualizarVis();
  construirMenuFoco();
};

window.cerebroPosicoes = function(){
  const r = {};
  for (const n of NOS) r[n.id] = [n.x,n.y,n.z];
  return r;
};

// ---------- eventos reais (vault e Eco) ----------
window.cerebroEvento = function(nomes){
  if (!NOS.length || !nomes || !nomes.length) return;
  garantirIncidencia();
  const alvos = [];
  for (const nome of nomes){
    const no = MAPA.get(nome);
    if (no){
      const i = NOS.indexOf(no);
      if (i>=0) alvos.push(i);
    }
  }
  for (const i of alvos){
    ATIVOS.set(i, performance.now());
    EXCITA[i] = Math.min(1.2, EXCITA[i]+1.0);
    const ks = INCIDENCIA.get(i)||[];
    const n = Math.min(ks.length, 6);
    for (let k=0;k<n;k++){
      PULSOS.push({e:ks[(Math.random()*ks.length)|0],
                   t:-0.02-Math.random()*0.2,
                   v:0.9+Math.random()*0.7, tr:true});
    }
  }
};

window.cerebroEco = function(estado){
  ECO_FALANDO = (estado==='falando');
  if (!NOS.length || !window.__hubs) return;
  const forca = estado==='falando' ? 0.85 :
                estado==='ouvindo' ? 0.45 :
                estado==='pensando' ? 0.3 : 0;
  if (!forca) return;
  garantirIncidencia();
  // quando fala, prioridade maxima para as notas em uso real recente
  const fonte = [];
  const agoraE = performance.now();
  if (ECO_FALANDO){
    for (const [i,t] of ATIVOS)
      if (i<NOS.length && agoraE-t<JANELA_USO) fonte.push(i);
  }
  if (fonte.length < 3){
    for (const id of window.__hubs){
      const no = MAPA.get(id);
      const i = no ? NOS.indexOf(no) : -1;
      if (i>=0 && !fonte.includes(i)) fonte.push(i);
    }
  }
  let feitos = 0;
  const limite = estado==='falando' ? 12 : 6;
  for (const i of fonte){
    if (feitos>=limite) break;
    EXCITA[i] = Math.min(1.2, EXCITA[i]+forca);
    const ks = INCIDENCIA.get(i)||[];
    if (ks.length){
      PULSOS.push({e:ks[(Math.random()*ks.length)|0],
                   t:-0.05, v:0.8+Math.random()*0.8, tr:true});
    }
    feitos++;
  }
};

function piscarInfo(txt){
  info.textContent = txt;
  clearTimeout(FLASH_TMR);
  FLASH_TMR = setTimeout(()=>{
    info.textContent = window.__infoBase || '';
  }, 2600);
}

// atividade real do agente: anel branco expandindo no neuronio acessado
window.cerebroAtividade = function(tipo, nomes){
  if (!NOS.length) return;
  garantirIncidencia();
  let achou = 0;
  for (const nome of (nomes||[])){
    const no = MAPA.get(nome);
    if (!no) continue;
    const i = NOS.indexOf(no);
    if (i < 0) continue;
    achou++;
    ATIVOS.set(i, performance.now());
    disparoNeural(i, tipo==='cognicao' ? 1.2 : 0.9, corDe(no.cl), 0);
    EXCITA[i] = Math.min(1.2, EXCITA[i] + (tipo==='cognicao' ? 1.2 : 0.9));
    RINGS.push({i, t:0});
    const ks = INCIDENCIA.get(i)||[];
    const n = Math.min(ks.length, tipo==='cognicao' ? 6 : 3);
    for (let k=0;k<n;k++){
      PULSOS.push({e: ks[(Math.random()*ks.length)|0],
                   t:-0.05-Math.random()*0.15,
                   v:1.0+Math.random()*0.8, tr:true});
    }
  }
  if (achou){
    const rot = {leitura:'lendo', escrita:'escrevendo',
                 cognicao:'pensando'}[tipo] || tipo;
    piscarInfo(rot+': '+(nomes[0]||'')+
      ((nomes.length>1)?' +'+(nomes.length-1):''));
  }
};

// ---------- interacao ----------
const painelInfo = document.getElementById('painelInfo');

function vizinhosDe(i){
  const s = new Set();
  if (!INCIDENCIA) garantirIncidencia();
  const ks = INCIDENCIA.get(i) || [];
  for (const eI of ks){
    const [a,b] = ARVIS[eI % ARVIS.length];
    s.add(a===i ? b : a);
  }
  return s;
}

function abrirArquivo(fp){
  if (!fp) return;
  fetch('http://localhost:8766/open-file',
    {method:'POST', headers:{'Content-Type':'application/json'},
     body:JSON.stringify({path:fp})}).catch(()=>{});
}

function limparSelecao(){
  selNo = -1; selViz.clear();
  RAMO_ATIVO.clear(); RAMO_DESDE = 0;
  painelInfo.style.display = 'none';

// clique SOBRE um no (ou perto) = girar; clique FORA dos nos = mover o grafo.
// botao direito sempre move.
cv.addEventListener('mousedown', e=>{
  mx0 = e.clientX; my0 = e.clientY;
  cv.classList.add('girando');
  if (e.button===2){ emPan = true; return; }
  const dpr = devicePixelRatio||1;
  const mxP = e.clientX*dpr, myP = e.clientY*dpr, limiar = 36*dpr;
  let sobreNo = false;
  for (let i=0;i<NOS.length;i++){
    if (VIS && !VIS[i]) continue;
    const dx = SX[i]-mxP, dy = SY[i]-myP;
    if (dx*dx+dy*dy < limiar*limiar){ sobreNo = true; break; }
  }
  if (sobreNo){ arrastando = true; emPan = false; cliqueNoX = e.clientX; cliqueNoY = e.clientY; }
  else { emPan = true; arrastando = false; if (e.button===0) limparSelecao(); }
});
window.addEventListener('mouseup', e=>{
  // clique (sem arraste) sobre um no: seleciona, voa e abre o painel
  const moveu = Math.hypot(e.clientX-cliqueNoX, e.clientY-cliqueNoY) > 6;
  if (arrastando && !moveu) {
    const dpr = devicePixelRatio||1;
    const mxP = e.clientX*dpr, myP = e.clientY*dpr, limiar = 36*dpr;
    let achou = -1;
    for (let i=0;i<NOS.length;i++){
      if (VIS && !VIS[i]) continue;
      const dx = SX[i]-mxP, dy = SY[i]-myP;
      if (dx*dx+dy*dy < limiar*limiar){ achou = i; break; }
    }
    if (achou >= 0) selecionarNo(achou);
  }
  emPan=false; arrastando=false; cv.classList.remove('girando');
});
window.addEventListener('mousemove', e=>{
  mouseMX = e.clientX * devicePixelRatio;
  mouseMY = e.clientY * devicePixelRatio;
  if (!emPan && !arrastando) return;
  const dx = (e.clientX-mx0)*(devicePixelRatio||1), dy=(e.clientY-my0)*(devicePixelRatio||1);
  if (arrastando){
    // gesto de giro (funcionamento original)
    velY = dx * 0.00028;
    velX = dy * 0.00018;
    rotY += velY * 14;
    rotX = Math.max(-1.1, Math.min(1.1, rotX + velX * 14));
  } else {
    // gesto de mover livremente
    const limX=cv.width*1.2, limY=cv.height*1.2;
    panX=Math.max(-limX,Math.min(limX,panX+dx));
    panY=Math.max(-limY,Math.min(limY,panY+dy));
    alvoPanX=panX; alvoPanY=panY;
  }
  mx0 = e.clientX; my0 = e.clientY;
  ultToque = performance.now();
});
cv.addEventListener('wheel', e=>{
  e.preventDefault();
  const dpr = devicePixelRatio||1;
  const cxT = cv.width/2, cyT = cv.height/2 + 12*dpr;
  const mxP = e.clientX*dpr, myP = e.clientY*dpr;
  const z0 = alvoZoom;
  alvoZoom = Math.max(.3, Math.min(6.5, alvoZoom * Math.exp(-e.deltaY*0.0011)));
  // ancora o ponto sob o mouse: pan compensa a mudanca de escala
  const vx = (mxP - cxT - panX) / zoom, vy = (myP - cyT - panY) / zoom;
  alvoPanX = mxP - cxT - vx*alvoZoom;
  alvoPanY = myP - cyT - vy*alvoZoom;
},{passive:false});
cv.addEventListener('contextmenu', e=>e.preventDefault());
// duplo clique: voa ate o no mais proximo do clique
cv.addEventListener('dblclick', e=>{

  alvoPanX += cxT - SX[melhor];

// ---------- sinapses ----------
function garantirIncidencia(){
  if (INCIDENCIA) return INCIDENCIA;
  INCIDENCIA = new Map();
  for (let k=0;k<ARVIS.length;k++){
    const [a,b]=ARVIS[k];
    if(!INCIDENCIA.has(a)) INCIDENCIA.set(a,[]);
    if(!INCIDENCIA.has(b)) INCIDENCIA.set(b,[]);
    INCIDENCIA.get(a).push(k);
    INCIDENCIA.get(b).push(k);
  }
  return INCIDENCIA;
}

// ---------- disparo neural destacado ----------
// Toque/acesso a um no: highlight intenso + particulas + propagacao em cascata.
function disparoNeural(i, intensidade, cor, profundidade){
  if (i<0 || i>=NOS.length) return;
  garantirIncidencia();
  const prof = profundidade || 0;
  // 1) highlight: pico de excitacao + halo nitido
  EXCITA[i] = Math.min(1.35, Math.max(EXCITA[i], intensidade));
  HALOS.push({i, t:0, cor, int:Math.min(1, intensidade)});
  RINGS.push({i, t:0});
  // 2) particulas luminosas: 15-30 por disparo
  const nP = 15 + Math.floor(Math.random()*16);
  emitirParticulas(i, cor, nP, intensidade);
  // pulsos de sinapse pelos canais do no
  const ksP = INCIDENCIA.get(i)||[];
  const nPu = Math.min(ksP.length, prof===0 ? 4 : 2);
  for (let k=0;k<nPu;k++){
    PULSOS.push({e: ksP[(Math.random()*ksP.length)|0],
                 t:-0.05, v:1.0+Math.random()*0.8, tr:true});
  }
  // 3) propagate: ativa vizinhos conectados com delay suave
  if (prof < 3){
    const ks = INCIDENCIA.get(i)||[];
    const nViz = Math.min(ks.length, prof===0 ? 6 : (prof===1 ? 4 : 2));
    const ger = GERACAO;
    for (let k=0;k<nViz;k++){
      const eI = ks[(Math.random()*ks.length)|0];
      const [a,b] = ARVIS[eI % ARVIS.length];
      const j = (a===i) ? b : a;
      if (VIS && !VIS[j]) continue;
      setTimeout(()=>{
        if (ger !== GERACAO) return;
        disparoNeural(j, intensidade*0.55, cor, prof+1);
      }, 160 + Math.random()*160);
    }
  }
}
function emitirParticulas(i, cor, n, intensidade){
  const dpr = devicePixelRatio||1;
  const cx = SX[i] !== undefined ? SX[i] : cv.width/2;
  const cy = SY[i] !== undefined ? SY[i] : cv.height/2;
  const base = (56 + 130*intensidade) * dpr;
  for (let k=0;k<n;k++){
    const a = Math.random()*6.283;
    const v = base*(0.6+Math.random()*0.9);
    PARTICULAS.push({x:cx, y:cy,
      vx:Math.cos(a)*v, vy:Math.sin(a)*v,
      cor: Math.random()<0.7 ? cor : '#ffffff',
      tam:(1.4+Math.random()*1.8)*dpr,
      vida:0.34+Math.random()*0.22,
      nac:performance.now()});
  }
  if (PARTICULAS.length>600) PARTICULAS.splice(0, PARTICULAS.length-600);
}

function construirJAdj(){
  if (!NOS.length) return;
  const a = NOS.map(()=>[]);
  for (const p of ARESTAS){ a[p[0]].push(p[1]); a[p[1]].push(p[0]); }
  JADJ = a;
}
function sementesDe(tipo){
  if (JSEEDS[tipo]) return JSEEDS[tipo];
  const kw = JREG[tipo]||[]; const sc=[];
  for (let i=0;i<NOS.length;i++){
    const t=(NOS[i].l||'').toLowerCase(); let s=0;
    for (const w of kw) if (t.indexOf(w)>=0) s++;
    if (s>0) sc.push([s,i]);
  }
  sc.sort((x,y)=>y[0]-x[0]);
  return JSEEDS[tipo]=sc.slice(0,BVC.sementeMax).map(p=>p[1]);
}
let SET_FALA = null;   // cache: indices de TODOS os nos de fala (para o Foco)
function indicesDeFala(){
  if (SET_FALA) return SET_FALA;
  const kw = JREG.fala || [];
  const s = new Set();
  for (let i=0;i<NOS.length;i++){
    const t = (NOS[i].l || '').toLowerCase();
    if (kw.some(w => t.indexOf(w) >= 0)) s.add(i);
  }
  SET_FALA = s;
  return s;
}

// ---------- áreas de fala (metáfora neurológica) ----------
// Assim como o cérebro ativa regiões em sequência ao falar (conceitualização,
// formulação/Broca, fonologia, articulação/motor, compreensão/Wernicke), o
// grafo agrupa neurônios em áreas e os acende em cascata quando o Eco fala.
const AREAS_FALA = [
  {n:'conceito',  kw:['planeja','conceito','ideia','missao','intenc','objetivo','estrat','pensar'], cor:'#cba6f7'},
  {n:'formula',   kw:['gramatica','sintaxe','estrutur','padrao','codigo','lingu','frase','regra'], cor:'#89b4fa'},
  {n:'fonema',    kw:['fono','siliba','palavra','som','signific','semant','lexic'], cor:'#a6e3a1'},
  {n:'motor',     kw:['voz','tts','audio','fala','speech','microfone','articul','falado'], cor:'#f38ba8'},
  {n:'compreende',kw:['compreens','entend','leitura','contexto','interpret','leia','entende'], cor:'#fab387'}
];
const AREA_FALA_CACHE = {};
function indicesDeArea(area){
  if (AREA_FALA_CACHE[area.n]) return AREA_FALA_CACHE[area.n];
  const s = new Set();
  for (let i=0;i<NOS.length;i++){
    const t = (NOS[i].l || '').toLowerCase();
    if (area.kw.some(w => t.indexOf(w) >= 0)) s.add(i);
  }
  AREA_FALA_CACHE[area.n] = s;
  return s;
}
let FALA_AREA_IDX = 0, FALA_AREA_ULT = 0;
function dispararAreasFala(t){
  if (!ECO_FALANDO || t - FALA_AREA_ULT < 720) return;
  FALA_AREA_ULT = t;
  // percorre as áreas em sequencia (conceito -> formula -> fonema -> motor)
  const area = AREAS_FALA[FALA_AREA_IDX % AREAS_FALA.length];
  FALA_AREA_IDX++;
  const nos = [...indicesDeArea(area)];
  if (!nos.length) return;
  const n = Math.min(5, nos.length);
  const escolhidos = new Set();
  for (let k=0;k<n;k++){
    const i = nos[(Math.random()*nos.length)|0];
    if (escolhidos.has(i)) continue;
    escolhidos.add(i);
    disparoNeural(i, 0.95, area.cor, 0);
  }
}
function recalcularJarvis(){
  JSEEDS={};
  if (!NOS.length){ JALVO=null; return; }
  if (!JADJ || JADJ.length!==NOS.length) construirJAdj();
  JALVO = new Float32Array(NOS.length);
  for (const tipo in JARVIS){
    const A=JARVIS[tipo]; const base=BVC.hops.map(h=>h*A.i);
    const visto=new Int16Array(NOS.length).fill(-1);
    let frente=sementesDe(tipo).slice(), h=0;
    while (frente.length && h<base.length){
      const nx=[];
      for (const i of frente){
        if (visto[i]>=0) continue;
        visto[i]=h;
        if (base[h]>JALVO[i]) JALVO[i]=base[h];
        for (const v of JADJ[i]) if (visto[v]<0) nx.push(v);
      }
      frente=nx.slice(0,BVC.frenteMax); h++;
    }
  }
}
function brainSet(payload){
  try{
    payload=payload||{}; let mudou=false;
    for (const t in payload){
      const e=payload[t]; const i=+e.i||0;
      if (i>0.01){ JARVIS[t]={t0:performance.now(),i:Math.min(1,i)}; mudou=true; }
      else if (JARVIS[t]){ delete JARVIS[t]; mudou=true; }
    }
    if (mudou) recalcularJarvis();
  }catch(e){}
}
window.brainSet = brainSet;
window.brain = {
  setActivity:(tipo,inten)=>brainSet({[tipo]:inten==null?1:Math.min(1,Math.max(0,inten))}),
  clearActivity:()=>brainSet({})
};

function jarvisTelemetria(t, dt){
  if (!NOS.length) return;
  const temAtiv = Object.keys(JARVIS).length > 0;
  if (!temAtiv && !JCUR) return;
  if (!JALVO || JALVO.length !== NOS.length){
    if (!temAtiv){ JCUR=null; return; }
    recalcularJarvis();
  }
  if (!JCUR || JCUR.length !== NOS.length) JCUR = new Float32Array(NOS.length);
  const ds = Math.min(50, dt) / 1000;
  let pico = -1, picoV = 0.03;
  for (let i=0;i<NOS.length;i++){
    const alvo = JALVO ? JALVO[i] : 0;
    const cur = JCUR[i];
    const taxa = (alvo > cur) ? BVC.subida : BVC.descida;
    JCUR[i] = cur + (alvo - cur) * Math.min(1, taxa * ds);
    const c = JCUR[i];
    if (c > 0.03){
      const pulso = c * (1 + BVC.amp *
        Math.sin((t/1000)*BVC.velPulso*2*Math.PI/6 + i*0.37));
      if (pulso > EXCITA[i]) EXCITA[i] = Math.min(1.3, pulso);
      if (VIS[i] && c > picoV){ picoV = c; pico = i; }
    }
  }
  if (pico >= 0 && t - JULT_ONDA > BVC.ondaMs){
    JULT_ONDA = t;
    garantirIncidencia();
    RINGS.push({i:pico, t:0});
    const ks = INCIDENCIA.get(pico) || [];
    if (ks.length){
      PULSOS.push({e:ks[(Math.random()*ks.length)|0],
                   t:-0.05, v:1.0+Math.random()*0.8, tr:true});
    }
  }
}

function dispararPulsos(t){
  // batida da voz: sinal REAL do Eco falando (vale mesmo sem decorativos)
  if (ECO_FALANDO && t-ULT_BATIDA>620){
    ULT_BATIDA=t;
    garantirIncidencia();
    const fala = sementesDe('fala') || [];
    if (fala.length){
      // regiao de fala disparando em tempo real junto com a voz
      const alvo = Math.min(3, 1 + ((t/620)|0) % 3);
      for (let k=0;k<alvo;k++){
        const i = fala[(FALA_ROT+k) % fala.length];
        disparoNeural(i, 0.95, '#8be9fd', 0);
      }
      FALA_ROT = (FALA_ROT + 1) % fala.length;
    }
    let i=-1;
    if (fala.length < 3){
      const agoraB=performance.now();
      let vivos=[];
      for (const [it,ts] of ATIVOS)
        if (it<NOS.length && agoraB-ts<JANELA_USO) vivos.push(it);
      if (vivos.length){
        i=vivos[(Math.random()*vivos.length)|0];
      } else if (window.__hubs && window.__hubs.size){
        const ids=[...window.__hubs];
        const no=MAPA.get(ids[(Math.random()*ids.length)|0]);
        i=no?NOS.indexOf(no):-1;
      }
    }
    if (i>=0){
      EXCITA[i]=Math.min(1.3,EXCITA[i]+0.35);
      RINGS.push({i,t:0});
      const ks=INCIDENCIA.get(i)||[];
      if (ks.length){
        PULSOS.push({e:ks[(Math.random()*ks.length)|0],
                     t:-0.05,v:1.0+Math.random()*0.8,tr:true});
      }
    }
  }
  let amb=0;
  for (const p of PULSOS) if (!p.tr) amb++;
  // decorativos desligados: os vivos terminam a viagem e nao nascem outros
  if (!AJUSTES.decor) return;
  const alvo = Math.max(36, Math.min(130, Math.floor(ARVIS.length/22)));
  while (amb < alvo && ARVIS.length){
    PULSOS.push({e:(Math.random()*ARVIS.length)|0,
                 t:-Math.random()*0.6, v:0.35+Math.random()*0.75, tr:false});
    amb++;
  }
  let excesso = amb - alvo;
  for (let i=PULSOS.length-1; i>=0 && excesso>0; i--){
    if (!PULSOS[i].tr){ PULSOS.splice(i,1); excesso--; }
  }
}

// ---------- projecao ----------
let SX = [], SY = [], SS = [], SZ = [], ORDEM = [];
function projetar(t){
  const cy=Math.cos(rotY), sy=Math.sin(rotY);
  const cxr=Math.cos(rotX), sxr=Math.sin(rotX);
  const zP = zoom, f = 900;
  const cxTela = W/2, cyTela = H/2 + 12*devicePixelRatio;
  for (let i=0;i<NOS.length;i++){
    const n=NOS[i];
    if (n.nasce<1) n.nasce=Math.min(1,n.nasce+0.02);
    // interpolacao suave para pos alvo
    n.cx += (n.x-n.cx)*0.06; n.cy += (n.y-n.cy)*0.06; n.cz += (n.z-n.cz)*0.06;
    // deriva organica (duas senoides por eixo) — amplitude e ritmo controlados por AJUSTES.movimento (0-1)
    // o bastante para cada no borbulhar de forma perceptivel sem desmanchar.
    const m = AJUSTES.movimento || 0.65;
    const dr = (2.0 + m * 10.0) * (0.5 + n.a * 0.8);
    const fbase = 0.0005 + m * 0.0015;
    const ox = Math.sin(t * (fbase * 2.8) + n.fase) + Math.sin(t * (fbase * 1.8) + n.fase * 2.3);
    const oy = Math.sin(t * (fbase * 2.5) + n.fase * 1.7) + Math.sin(t * (fbase * 1.6) + n.fase * 3.1);
    const oz = Math.sin(t * (fbase * 2.2) + n.fase * 2.9) + Math.sin(t * (fbase * 1.4) + n.fase * 4.7);
    let wx=n.cx+ox*dr, wy=n.cy+oy*dr, wz=n.cz+oz*dr;
    // rotacao Y
    let rx=wx*cy-wz*sy, rz=wx*sy+wz*cy;
    // inclinacao X
    let ry=wy*cxr-rz*sxr; rz=wy*sxr+rz*cxr;
    const s=f/(f-rz*zP);
    SX[i]=cxTela+rx*s*zP+panX; SY[i]=cyTela+ry*s*zP+panY; SS[i]=s; SZ[i]=rz;
  }
  ORDEM.length=NOS.length;
  for (let i=0;i<NOS.length;i++) ORDEM[i]=i;
  ORDEM.sort((a,b)=>SZ[b]-SZ[a]);
}

function desenharZonaFala(){
  // região cortical de fala: halo rosa ao redor dos neurônios de fala
  const pts = [];
  for (let i=0;i<NOS.length;i++){
    if (VIS && !VIS[i]) continue;
    if (!NOS[i]._fala) continue;
    if (SS[i]<0.15) continue;
    pts.push([SX[i],SY[i]]);
  }
  if (pts.length < 3) return;
  let cx=0, cy=0;
  for (const p of pts){ cx+=p[0]; cy+=p[1]; }
  cx/=pts.length; cy/=pts.length;
  let raio=0;
  for (const p of pts){ const d=Math.hypot(p[0]-cx,p[1]-cy); if (d>raio) raio=d; }
  raio = raio + 20*devicePixelRatio;
  const grad = ctx.createRadialGradient(cx,cy,raio*0.15, cx,cy,raio);
  grad.addColorStop(0,'rgba(243,139,168,0.18)');
  grad.addColorStop(1,'rgba(243,139,168,0)');
  ctx.fillStyle=grad;
  ctx.beginPath(); ctx.arc(cx,cy,raio,0,6.283); ctx.fill();
  ctx.globalAlpha=0.32;
  ctx.strokeStyle='#f38ba8';
  ctx.lineWidth=1.4*devicePixelRatio;
  ctx.setLineDash([5*devicePixelRatio,4*devicePixelRatio]);
  ctx.beginPath(); ctx.arc(cx,cy,raio,0,6.283); ctx.stroke();
  ctx.setLineDash([]);
  ctx.globalAlpha=1;
}

function desenhar(t, dt){
  ctx.fillStyle='#0b0e14';
  ctx.fillRect(0,0,W,H);
  desenharZonaFala();

  // arestas
  ctx.lineWidth = 1;
  const margem = 60*devicePixelRatio;
  const foraTela = (x,y)=> x<-margem || x>W+margem || y<-margem || y>H+margem;
  for (let k=0;k<ARVIS.length;k++){
    const [a,b]=ARVIS[k];
    const za=(SZ[a]+900)/1800, zb=(SZ[b]+900)/1800;
    if (SS[a]<0.15||SS[b]<0.15) continue;
    if (foraTela(SX[a],SY[a]) && foraTela(SX[b],SY[b])) continue;
    const prof=Math.min(1,(za+zb)/2*1.25);
    let eDim = 1;
    if (selNo>=0 && a!==selNo && b!==selNo && !selViz.has(a) && !selViz.has(b))
      eDim = 0.10;
    const eFala = NOS[a]._fala && NOS[b]._fala;
    if (eFala){
      ctx.strokeStyle='rgba(243,139,168,'+(0.22+prof*0.34*eDim).toFixed(3)+')';
      ctx.lineWidth=1.6;
    } else {
      ctx.strokeStyle='rgba(137,180,250,'+(0.05+prof*0.13*eDim).toFixed(3)+')';
      ctx.lineWidth=1;
    }
    ctx.beginPath();ctx.moveTo(SX[a],SY[a]);ctx.lineTo(SX[b],SY[b]);ctx.stroke();
  }

  // pulsos de sinapse
  for (let pi=PULSOS.length-1; pi>=0; pi--){
    const p=PULSOS[pi];
    p.t+=p.v*dt/1000;
    if (p.t>=1){
      const [a,b]=ARVIS[p.e%ARVIS.length];
      EXCITA[b]=Math.min(1,EXCITA[b]+0.85);
      if (p.tr || !AJUSTES.decor){ PULSOS.splice(pi,1); continue; }
      p.e=(Math.random()*ARVIS.length)|0;p.t=-0.15-Math.random()*0.5;
      continue;
    }
    if (p.t<0) continue;
    const [ai,bi]=ARVIS[p.e%ARVIS.length];
    const na=NOS[ai],nb=NOS[bi];
    const ca=corDe(na.cl);
    const tt=p.t, tt2=tt*tt;
    const x=SX[ai]+(SX[bi]-SX[ai])*tt, y=SY[ai]+(SY[bi]-SY[ai])*tt;
    const s=(SS[ai]+(SS[bi]-SS[ai])*tt)*(2.6+EXCITA[bi]*2);
    ctx.globalAlpha=Math.min(1,0.85*(1-tt2*0.25));
    ctx.drawImage(sprite(ca),x-s*8,y-s*8,s*16,s*16);
    ctx.globalAlpha=1;
  }

  // nos (pintor: fundo primeiro)
  const falaSet = indicesDeFala();
  hoverId=-1; let melhorD=1e9;
  for (const i of ORDEM){
    const n=NOS[i];
    if (VIS && !VIS[i]){ EXCITA[i]*=0.955; continue; }
    EXCITA[i]*=0.955;
    // ramificacao do no selecionado brilha por 16s apos o clique
    if (RAMO_ATIVO.size && RAMO_ATIVO.has(i)
        && performance.now()-RAMO_DESDE < 16000){
      EXCITA[i] = Math.max(EXCITA[i], 0.5 + 0.28*Math.sin(t*0.005 + i));
    }
    if (foraTela(SX[i],SY[i])) continue;
    const prof=Math.max(0,Math.min(1,(SZ[i]+900)/1800));
    let esc=SS[i]*(0.72+0.5*prof)*n.nasce;
    // sinapse nova: nasceu ha menos de 12h pulsa em amarelo forte (janela fixa)
    const SINAPSE_H = 12;
    const NOVA_ATIVO = true;
    const NOVA_INT = 0.5;
    const NOVA_BRILHO = 0.5;
    let excNova=0, pulsoNova=0;
    if (NOVA_ATIVO && n.tm){
      const idadeH=(Date.now()/1000-n.tm)/3600;
      if (idadeH>=0 && idadeH<SINAPSE_H){
        excNova=Math.min(1,(SINAPSE_H-idadeH)/SINAPSE_H*1.15) * NOVA_INT;
        pulsoNova=0.5+0.5*Math.sin(t*0.0055+n.fase*6.283);
        esc*= (1+0.13*pulsoNova*excNova);
      }
    }
    const r=(2.3+Math.min(8.5,Math.sqrt(n.g)*1.25))*(0.75+n.a*0.45)*esc*
      (1+EXCITA[i]*0.5);
    let cor=corDe(n.cl);
    if (excNova>0) cor=mistura(cor,'#FFD60A',Math.min(1,0.30+0.50*pulsoNova*excNova*NOVA_INT));
    let dim = 1;
    if (selNo>=0 && i!==selNo && !selViz.has(i)) dim = 0.15;
    ctx.globalAlpha=Math.min(1,(0.30+0.62*prof))*dim;
    const sp=sprite(cor), tam=r*6;
    ctx.drawImage(sp,SX[i]-tam/2,SY[i]-tam/2,tam,tam);
    if (n._fala){
      ctx.globalAlpha=0.55;
      ctx.strokeStyle='#f38ba8';
      ctx.lineWidth=1.2*devicePixelRatio;
      ctx.beginPath();
      ctx.arc(SX[i],SY[i], tam*0.5+2*devicePixelRatio, 0, 6.283);
      ctx.stroke();
      ctx.globalAlpha=1;
    }
    if (falaSet.has(i) && i!==selNo){
      ctx.globalAlpha=Math.min(0.7, (0.35+0.25*Math.sin(t*0.004+i))*prof);
      ctx.strokeStyle='#f38ba8';
      ctx.lineWidth=1.3*devicePixelRatio;
      ctx.beginPath();
      ctx.arc(SX[i],SY[i], tam*0.5+3*devicePixelRatio, 0, 6.283);
      ctx.stroke();
      ctx.globalAlpha=1;
    }
    if (i===selNo){
      ctx.globalAlpha=0.95;
      ctx.strokeStyle=corDe(n.cl);
      ctx.lineWidth=2.2*devicePixelRatio;
      ctx.beginPath();
      ctx.arc(SX[i],SY[i], tam*0.5+4*devicePixelRatio, 0, 6.283);
      ctx.stroke();
    }
    if (excNova>0.05 && pulsoNova>0.55 && NOVA_BRILHO>0){
      ctx.globalAlpha=Math.min(1,0.45*excNova*(pulsoNova-0.55)*NOVA_BRILHO);
      const brilho=sprite('#FFEA00'), tamB=tam*1.18;
      ctx.drawImage(brilho,SX[i]-tamB/2,SY[i]-tamB/2,tamB,tamB);
    }
    if (EXCITA[i]>0.08){
      ctx.globalAlpha=EXCITA[i]*0.9;
      const brilho=sprite('#ffffff');
      ctx.drawImage(brilho,SX[i]-tam*0.24,SY[i]-tam*0.24,tam*0.48,tam*0.48);
    }
    ctx.globalAlpha=1;
    const dxm=SX[i]/devicePixelRatio-mouseMX/devicePixelRatio,
          dym=SY[i]/devicePixelRatio-mouseMY/devicePixelRatio;
    const dm=dxm*dxm+dym*dym, lim=Math.max(9,r/devicePixelRatio+5);
    if (dm<lim*lim && dm<melhorD){melhorD=dm;hoverId=i;}
  }

  // aneis de cognicao: atividade real do agente sobre o neuronio
  for (let ri=RINGS.length-1; ri>=0; ri--){
    const g=RINGS[ri];
    g.t += dt/900;
    if (g.t>=1){ RINGS.splice(ri,1); continue; }
    const prof=Math.max(0,Math.min(1,(SZ[g.i]+900)/1800));
    const esc=SS[g.i]*(0.72+0.5*prof)*NOS[g.i].nasce;
    if (esc>0.02){
      const r=(2.3+Math.min(8.5,Math.sqrt(NOS[g.i].g)*1.25))*esc;
      ctx.globalAlpha=(1-g.t)*0.85;
      ctx.strokeStyle='#ffffff';
      ctx.lineWidth=2*devicePixelRatio;
      ctx.beginPath();
      ctx.arc(SX[g.i],SY[g.i], r*(1.4+3.4*g.t)*devicePixelRatio, 0, 6.283);
      ctx.stroke();
    }
    ctx.globalAlpha=1;
  }

  // halos destacados do disparo neural (flash curto e intenso)
  for (let hi=HALOS.length-1; hi>=0; hi--){
    const h = HALOS[hi];
    h.t += dt/420;
    if (h.t>=1){ HALOS.splice(hi,1); continue; }
    const prof=Math.max(0,Math.min(1,(SZ[h.i]+900)/1800));
    const esc=SS[h.i]*(0.72+0.5*prof)*NOS[h.i].nasce;
    if (esc>0.02){
      const r=(2.3+Math.min(8.5,Math.sqrt(NOS[h.i].g)*1.25))*esc;
      const a=(1-h.t)*h.int;
      ctx.globalAlpha=Math.min(0.9,a*0.9);
      ctx.strokeStyle=h.cor;
      ctx.lineWidth=2.4*devicePixelRatio;
      ctx.beginPath();
      ctx.arc(SX[h.i],SY[h.i], r*(1.4+3.0*h.t)*devicePixelRatio,0,6.283);
      ctx.stroke();
      ctx.globalAlpha=Math.min(0.8,a);
      ctx.fillStyle=h.cor;
      ctx.beginPath();
      ctx.arc(SX[h.i],SY[h.i], r*0.9*devicePixelRatio,0,6.283);
      ctx.fill();
    }
    ctx.globalAlpha=1;
  }

  // particulas luminosas do disparo neural
  for (let pi=PARTICULAS.length-1; pi>=0; pi--){
    const q = PARTICULAS[pi];
    const t = (performance.now()-q.nac)/1000;
    if (t>=q.vida || q.vida<=0){ PARTICULAS.splice(pi,1); continue; }
    q.x += q.vx*dt/1000;
    q.y += q.vy*dt/1000;
    q.vx *= 0.96;
    q.vy *= 0.96;
    const a = 1 - t/q.vida;
    ctx.globalAlpha = Math.max(0, a*0.95);
    ctx.fillStyle = q.cor;
    ctx.beginPath();
    ctx.arc(q.x, q.y, q.tam*(0.4+0.6*a), 0, 6.283);
    ctx.fill();
  }
  ctx.globalAlpha=1;

  // etiquetas dos hubs proximos da frente
  if (zoom>0.8){
    ctx.font=(10*devicePixelRatio)+'px Segoe UI';
    ctx.fillStyle='rgba(205,214,244,0.72)';
    for (const i of ORDEM){
      const n=NOS[i];
      if (VIS && !VIS[i]) continue;
      if (!window.__hubs.has(n.id)) continue;
      if ((SZ[i]+900)/1800<0.58 || SS[i]<0.9) continue;
      ctx.fillText(n.l.slice(0,34), SX[i]+7*devicePixelRatio,
        SY[i]-6*devicePixelRatio);
    }
  }
  if (hoverId>=0){
    const n=NOS[hoverId];
    hov.style.display='block';
    hov.style.left=Math.min(window.innerWidth-250,mouseMX/devicePixelRatio+14)+'px';
    hov.style.top=(mouseMY/devicePixelRatio+14)+'px';
    hov.innerHTML='<div>'+n.l.replace(/</g,'&lt;').slice(0,80)+
      '</div><div class="cl" style="color:'+corDe(n.cl)+'">'+n.cl+
      ' \u00B7 grau '+n.g+'</div>';
    cv.style.cursor='pointer';
  } else {
    hov.style.display='none';
    if (!arrastando) cv.style.cursor='grab';
  }
}

function laco(t){
  const dt=Math.min(50,t-(laco._ant||t)); laco._ant=t;
  const rotAlvo = 0.0015 + (AJUSTES.rotacao || 0.6) * 0.0045;
  if (t < pausaGiroAte){
    // pausa de giro apos clique em no: mata inercia suavemente
    velY*=0.85; velX*=0.85;
  } else if (!arrastando && t-ultToque>2600){
    velY+=(rotAlvo-velY)*0.012; velX*=0.97;
    rotY+=velY*dt/16.7; rotX+=velX*dt/16.7;
  } else if (arrastando){
    // ja aplicado no mousemove
  } else {
    rotY+=velY*dt/16.7; rotX+=velX*dt/16.7; velY*=0.96;
  }
  zoom+=(alvoZoom-zoom)*0.09;
  panX+=(alvoPanX-panX)*0.09; panY+=(alvoPanY-panY)*0.09;
  if (FILTRO==='__ativos' && t-(laco._visAt||0)>5000){
    laco._visAt=t; atualizarVis();
  }
  if (NOS.length){ jarvisTelemetria(t,dt); dispararPulsos(t); dispararAreasFala(t); projetar(t); desenhar(t,dt); }
  requestAnimationFrame(laco);
}
requestAnimationFrame(laco);

function atualizarVis(){
  VIS = new Uint8Array(NOS.length);
  ARVIS = [];
  const agoraV = performance.now();
  const agoraS = Date.now()/1000;
  const SINAPSE_H = 12;
  // rede de fala: neuronios de fala + vizinhos diretos (liga as ilhas)
  let redeFala = null;
  if (FILTRO==='__fala'){
    const idIdx = new Map(); NOS.forEach((n,i)=>idIdx.set(n.id,i));
    redeFala = new Set(indicesDeFala());
    for (const [a,b] of ARESTAS){
      const ia=idIdx.get(a), ib=idIdx.get(b);
      if (ia!=null && redeFala.has(ia) && ib!=null) redeFala.add(ib);
      if (ib!=null && redeFala.has(ib) && ia!=null) redeFala.add(ia);
    }
  }
  for (let i=0;i<NOS.length;i++){
    let vis = !FILTRO || NOS[i].cl===FILTRO;
    if (!vis && FILTRO==='__ativos')
      vis = agoraV-(ATIVOS.get(i)||-1e15)<JANELA_USO;
    if (!vis && FILTRO==='__novas')
      vis = NOS[i].tm && (agoraS - NOS[i].tm)/3600 >= 0 && (agoraS - NOS[i].tm)/3600 < SINAPSE_H;
    if (!vis && FILTRO==='__fala')
      vis = redeFala.has(i);
    VIS[i]=vis?1:0;
  }
  for (const [a,b] of ARESTAS) if (VIS[a]&&VIS[b]) ARVIS.push([a,b]);
  INCIDENCIA = null;
  const base = NOS.length + ' notas \u00B7 ' + ARESTAS.length +
    ' conex\u00F5es \u00B7 ' + new Set(NOS.map(n=>n.cl)).size + ' clusters';
  let nomeFoco = rotulo(FILTRO);
  if (FILTRO==='__ativos') nomeFoco = 'uso do Eco';
  if (FILTRO==='__novas') nomeFoco = 'sinapses novas';
  if (FILTRO==='__fala') nomeFoco = 'fala';
  info.textContent = FILTRO ? base+' \u00B7 foco: '+nomeFoco : base;
  window.__infoBase = info.textContent;
  if (selNo>=0 && (!VIS[selNo])) limparSelecao();
}

function construirMenuFoco(){
  const lista = document.getElementById('listaFoco');
  lista.innerHTML = '';
  const contagem = {};
  for (const n of NOS) contagem[n.cl]=(contagem[n.cl]||0)+1;
  const cls = Object.keys(contagem).sort((a,b)=>contagem[b]-contagem[a]);
  const btTudo = document.createElement('button');
  btTudo.className='foco-btn'+(FILTRO?'':' on');
  btTudo.title=DESCRICOES_FOCO.__tudo;
  btTudo.innerHTML='Tudo <span>'+NOS.length+'</span>';
  btTudo.onclick=()=>{ FILTRO=null; atualizarVis(); construirMenuFoco(); };
  lista.appendChild(btTudo);
  // foco especial: o que o Eco realmente usou nos ultimos 10 minutos
  let nAtivos=0;
  const agoraM=performance.now();
  for (const [i,tM] of ATIVOS)
    if (i<NOS.length && agoraM-tM<JANELA_USO) nAtivos++;
  const btUso=document.createElement('button');
  btUso.className='foco-btn'+(FILTRO==='__ativos'?' on':'');
  btUso.title=DESCRICOES_FOCO.__ativos;
  btUso.innerHTML='Uso do Eco <span>'+nAtivos+'</span>';
  btUso.onclick=()=>{
    FILTRO=(FILTRO==='__ativos'?null:'__ativos');
    atualizarVis(); construirMenuFoco();
  };
  lista.appendChild(btUso);
  // foco especial: sinapses novas (nascidas nas ultimas 12 horas)
  let nNovas=0;
  const SINAPSE_H = 12;
  const agoraS = Date.now()/1000;
  for (const n of NOS)
    if (n.tm && (agoraS - n.tm)/3600 >= 0 && (agoraS - n.tm)/3600 < SINAPSE_H) nNovas++;
  const btNovas=document.createElement('button');
  btNovas.className='foco-btn'+(FILTRO==='__novas'?' on':'');
  btNovas.title=DESCRICOES_FOCO.__novas;
  btNovas.innerHTML='Sinapses novas <span>'+nNovas+'</span>';
  btNovas.onclick=()=>{
    FILTRO=(FILTRO==='__novas'?null:'__novas');
    atualizarVis(); construirMenuFoco();
  };
  lista.appendChild(btNovas);
  // foco especial: neurônios da fala (áreas ativadas quando o Eco fala)
  const nFala = indicesDeFala().size;
  const btFala=document.createElement('button');
  btFala.className='foco-btn'+(FILTRO==='__fala'?' on':'');
  btFala.title=DESCRICOES_FOCO.__fala;
  btFala.innerHTML='<span style="display:inline-block;width:8px;height:8px;'
    +'border-radius:50%;background:#f38ba8;margin-right:6px;'
    +'vertical-align:middle"></span>Fala <span>'+nFala+'</span>';
  btFala.onclick=()=>{
    FILTRO=(FILTRO==='__fala'?null:'__fala');
    atualizarVis(); construirMenuFoco();
  };
  lista.appendChild(btFala);
  for (const c of cls){
    const b=document.createElement('button');
    b.className='foco-btn'+(FILTRO===c?' on':'');
    b.title=DESCRICOES_FOCO[c] ||
      ('Notas sobre '+rotulo(c)+'.');
    b.innerHTML='<span style="display:inline-block;width:8px;height:8px;'
      +'border-radius:50%;background:'+corDe(c)+';margin-right:6px;'
      +'vertical-align:middle"></span>'+rotulo(c)
      +' <span>'+contagem[c]+'</span>';
    b.onclick=()=>{ FILTRO=(FILTRO===c?null:c); atualizarVis(); construirMenuFoco(); };
    lista.appendChild(b);
  }
}

valRot.textContent=Math.round(AJUSTES.rotacao*100)+'%';
rgRot.addEventListener('input',()=>{
  AJUSTES.rotacao=+rgRot.value;
  valRot.textContent=Math.round(AJUSTES.rotacao*100)+'%';
  salvarAjustes();
});

function pintarDecor(){
  estDecor.textContent=AJUSTES.decor?'ligado':'desligado';
  btDecor.classList.toggle('on',AJUSTES.decor);
}
btDecor.addEventListener('click',()=>{
  AJUSTES.decor=!AJUSTES.decor;
  pintarDecor(); salvarAjustes();
});
pintarDecor();

const btTopo=document.getElementById('btTopo');
btTopo.addEventListener('click',()=>{
  try{
    pywebview.api.topo().then(f=>{
      btTopo.textContent = f ? 'Fundo' : 'Frente';
    });
  }catch(e){}
});

// centralizar: volta pan e zoom ao padrao (o easing existente anima suave)
document.getElementById('btCentro').addEventListener('click',()=>{
  alvoPanX = 0; alvoPanY = 0; alvoZoom = 1.0;
});

window.cerebroAjustesAplicar = function(txt){
  try{
    Object.assign(AJUSTES, JSON.parse(txt));
    if (!isFinite(AJUSTES.foco) || AJUSTES.foco < -1) AJUSTES.foco=-1;
    if (AJUSTES.foco>1) AJUSTES.foco=1;
    if (!isFinite(AJUSTES.viva)) AJUSTES.viva=0.65;
    if (AJUSTES.viva<0) AJUSTES.viva=0;
    if (AJUSTES.viva>1) AJUSTES.viva=1;
    AJUSTES.decor = AJUSTES.decor !== false;
    if (!isFinite(AJUSTES.movimento)) AJUSTES.movimento = 0.65;
    if (AJUSTES.movimento < 0) AJUSTES.movimento = 0;
    if (AJUSTES.movimento > 1) AJUSTES.movimento = 1;
    if (!isFinite(AJUSTES.rotacao)) AJUSTES.rotacao = 0.6;
    if (AJUSTES.rotacao < 0) AJUSTES.rotacao = 0;
    if (AJUSTES.rotacao > 1) AJUSTES.rotacao = 1;
    rgFoco.value=AJUSTES.foco; valFoco.textContent=Math.round(AJUSTES.foco*100)+'%';
    rgViva.value=AJUSTES.viva; valViva.textContent=Math.round(AJUSTES.viva*100)+'%';
    rgMov.value=AJUSTES.movimento; valMov.textContent=Math.round(AJUSTES.movimento*100)+'%';
    rgRot.value=AJUSTES.rotacao; valRot.textContent=Math.round(AJUSTES.rotacao*100)+'%';
    pintarDecor();
    construirMenuFoco();
  }catch(e){}
};

window.cerebroPronto = true;
</script>
</body>
</html>
