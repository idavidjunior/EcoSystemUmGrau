# ============================================================================
# CATÁLOGO DE FONTES DE CONHECIMENTO TÉCNICO PARA PROGRAMAÇÃO
# ============================================================================
# Versão: 1.0.0
# Princípio: Fontes são pontos de partida para investigação, não lista fechada.
# Quality = authority + evidence + reproducibility + freshness + relevance + utility
# ============================================================================

version: "1.0.0"
description: "Catálogo de fontes de conhecimento técnico — seed sources para investigação"

# Classificação de autoridade (dimensão, não critério único):
#   A = Autoridade primária (docs oficiais, specs, RFCs)
#   B = Autoridade acadêmica (universidades, papers, periódicos)
#   C = Implementação real (projetos maduros, código em produção)
#   D = Conhecimento de campo (issues, PRs, SO, blogs, experimentos)
#   E = Conteúdo secundário (tutoriais, vídeos, posts)

# Estados da fonte:
#   active = verificada e acessível
#   monitored = rastreada pelo evolution_radar
#   seed = ponto de partida, ainda não integrada ao pipeline

