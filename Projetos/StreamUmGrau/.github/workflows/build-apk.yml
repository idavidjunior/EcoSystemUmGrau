name: Build APK StreamUmGrau

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Dependencias
        run: flutter pub get

      - name: Analise estatica (gate)
        run: flutter analyze

      - name: Testes (gate)
        run: flutter test

      - name: Build APK
        run: flutter build apk --debug

      - name: Listar APK gerado
        run: ls -la build/app/outputs/flutter-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stream-um-grau-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
