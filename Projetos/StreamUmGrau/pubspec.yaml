name: stream_um_grau
description: >-
  MVP de aplicativo de streaming de midia e catalogo de videos
  (filmes, series e doramas) com catalogo conectado ao Supabase.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Banco de dados / backend
  supabase_flutter: ^2.8.0

  # Utilidades
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Para imagens locais de placeholder (descomente quando adicionar assets):
  # assets:
  #   - assets/images/
