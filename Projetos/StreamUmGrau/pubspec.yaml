name: stream_um_grau
description: >-
  MVP de aplicativo de streaming de midia e catalogo de videos
  (filmes, series e doramas) com catalogo conectado ao Supabase.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Banco de dados / backend
  supabase_flutter: ^2.8.0

  # Persistencia local (favoritos)
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

  assets:
    - assets/icons/

# Geracao de icones do launcher (roda no CI: dart run flutter_launcher_icons)
flutter_launcher_icons:
  android: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#0E0E11"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
  min_sdk_android: 21

# Tela de splash nativa (roda no CI: dart run flutter_native_splash:create)
flutter_native_splash:
  color: "#0E0E11"
  image: "assets/icons/app_icon.png"
  android_12:
    color: "#0E0E11"
    image: "assets/icons/app_icon.png"
