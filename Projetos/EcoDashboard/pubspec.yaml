name: eco_dashboard
description: EcoSystemUmGrau Desktop Dashboard — Visualização viva do ecossistema
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # WebSocket para jarvis_bridge:8765
  web_socket_channel: ^2.4.0
  # State management simples
  provider: ^6.1.2
  # Intl para formatação de datas
  intl: ^0.19.0
  # Path provider para assets
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # Assets (ícones, fontes futuras)
  assets:
    - assets/

  # Desktop Windows config
  # fonts:
  #   - family: JetBrainsMono
  #     fonts:
  #       - asset: assets/fonts/JetBrainsMono-Regular.ttf
  #       - asset: assets/fonts/JetBrainsMono-Bold.ttf
  #         weight: 700