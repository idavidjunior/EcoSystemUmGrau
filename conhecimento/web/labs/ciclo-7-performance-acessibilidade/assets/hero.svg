<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="titulo">
  <title id="titulo">Banner do blog Um Grau — tecnologias web</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f2a44"/>
      <stop offset="100%" stop-color="#4a3f8a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#g)"/>
  <text x="80" y="210" font-family="system-ui, sans-serif" font-size="48" font-weight="bold" fill="#ffffff">Um Grau a Mais</text>
  <text x="80" y="270" font-family="system-ui, sans-serif" font-size="24" fill="#cfe0ff">Engenharia web, um ciclo de cada vez.</text>
</svg>