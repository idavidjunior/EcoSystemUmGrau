name: Web CI — Run Suite Labs
on:
  push:
    paths:
      - 'conhecimento/web/**'
  pull_request:
    paths:
      - 'conhecimento/web/**'
  workflow_dispatch:

jobs:
  run-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install deps
        run: pip install httpx websockets
      - name: Run suite (deterministic labs)
        run: |
          python conhecimento/web/run_suite.py
      - name: Upload suite benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ciclo-9-run-suite
          path: conhecimento/web/benchmarks/ciclo-9-run-suite.json
          if-no-files-found: ignore