<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>teste vis plano</title>
<style>body{margin:0;background:#1e1e2e}#net{width:100vw;height:100vh}</style>
<script src="vendor/vis-network.min.js"></script>
</head>
<body>
<div id="net"></div>
<script>
  window.__erros__ = [];
  window.addEventListener('error', function(e){ window.__erros__.push(String(e.message||e.error||e)); });
  var dados = { nodes: [{id:1,label:'A'},{id:2,label:'B'},{id:3,label:'C'}],
                edges: [{from:1,to:2},{from:2,to:3}] };
  var container = document.getElementById('net');
  try {
    var network = new vis.Network(container, dados, { physics: { stabilization: false } });
    window.__passou__ = 'sim';
  } catch(e) {
    window.__erro__ = String(e && e.message || e);
  }
</script>
</body>
</html>
