<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>teste vis minimo</title>
<style>body{margin:0;background:#1e1e2e}#net{width:100vw;height:100vh}</style>
<script src="vendor/vis-network.min.js"></script>
</head>
<body>
<div id="net"></div>
<script>
  window.__passou__ = 'nao';
  try {
    var nodes = new vis.DataSet([{id:1,label:'A'},{id:2,label:'B'},{id:3,label:'C'}]);
    var edges = new vis.DataSet([{from:1,to:2},{from:2,to:3}]);
    var container = document.getElementById('net');
    var network = new vis.Network(container, {nodes:nodes, edges:edges}, {});
    window.__passou__ = 'sim';
  } catch(e) {
    window.__erro__ = String(e && e.message || e);
  }
</script>
</body>
</html>
