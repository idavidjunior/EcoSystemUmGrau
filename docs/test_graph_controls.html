<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Cerebro Vivo - TESTE</title>
<style>
body{background:#1e1e2e;color:#cdd6f4;font-family:Segoe UI;padding:10px}
#results{white-space:pre-wrap;background:#313244;border-radius:8px;padding:12px}
.pass{color:#a6e3a1}.fail{color:#f38ba8}
</style>
</head><body>
<h2>Teste de Controles do Cerebro Vivo</h2>
<div id="results"></div>
<div id="net" style="width:600px;height:350px;border:1px solid #45475a;visibility:hidden"></div>

<script src="https://unpkg.com/vis-network@9.1.2/standalone/umd/vis-network.min.js"></script>
<script>
(function(){
    var out = document.getElementById('results');
    var log = function(msg,cls){ var d=document.createElement('div'); d.className=cls||''; d.textContent=msg; out.appendChild(d); };

    // Check for function definitions
    ['_aplicarVelocidade','_aplicarOrbita','_atualizarStats'].forEach(function(fn){
        var ok = typeof window[fn] === 'function';
        log((ok?'PASS ':'FAIL ')+'global.'+fn+(ok?' exists':' MISSING'), ok?'pass':'fail');
    });

    // Check localStorage defaults
    ['velGrafo','orbGrafo','labelsOcultos','menuOculto'].forEach(function(k){
        var v = localStorage.getItem(k);
        log('OK    localStorage.'+k+' = '+(v||'<null>'));
    });

    // Build minimal test to verify vis-network loads
    var nodes = new vis.DataSet([{id:1,label:'N1'},{id:2,label:'N2'}]);
    var edges = new vis.DataSet([{from:1,to:2}]);
    var container = document.getElementById('net');
    var network = new vis.Network(container,{node{id:1,label:'N1'},edges,{}});
    network.once('stabilized',function(){
        log('OK    vis.Network stabilized', 'pass');
        typeof _aplicarVelocidade==='function' && _aplicarVelocidade(2.0);
        log(typeof _aplicarVelocidade==='function'?'OK    _aplicarVelocidade(2.0) called':'----- _aplicarVelocidade skipped');
    });
} catch(e){
    log('ERROR vis.Network: '+e.message,'fail');
}

// Simulate slider from widget
var ev = document.createEvent('Event');
ev.initEvent('input',true,true);
var faker={value:2.5,dispatchEvent:function(ee){_aplicarVelocidade?.(2.5)}};
faker.dispatchEvent(ev);
setTimeout(function(){ document.title='TESTE CONCLUIDO'; },1000);
</script>
</body></html>
