  const nodes = new vis.DataSet([{"id": "p-aapt-javac-d8-apksigner", "label": "aapt + javac + d8 + apksigner", "color": "#4e79a7", "size": 12, "title": "android_pure_sdk\n\nPipeline manual Android sem Gradle: aapt package (R.java) -> javac -> jar -> d8 -> aapt package (APK) -> aapt add (dex) -> zipalign -> apksigner", "cat": "padroes", "cl": "android"},{"id": "p-edittext-inline-editing-toggle", "label": "EditText inline editing toggle", "color": "#4e79a7", "size": 12, "title": "android_pure_sdk\n\nDesabilita EditText (enabled=false, focusable=false, cursorVisible=false, background=null) quando nao esta em edicao. Habilita ao editar. Remove TextWatcher velho antes de setText().", "cat": "padroes", "cl": "android"},{"id": "p-numpad-with-stringbuilder-buffer", "label": "Numpad with StringBuilder buffer", "color": "#4e79a7", "size": 12, "title": "android_pure_sdk\n\nStringBuilder priceBuffer com virgula unica. Formatacao: raw -> pad left with zeros -> insert comma at len-2. setAlpha(0) em vez de setVisibility(GONE) para manter grid.", "cat": "padroes", "cl": "android"},{"id": "p-json-persistence-com-file-parameter", "label": "JSON persistence com File parameter", "color": "#4e79a7", "size": 12, "title": "android_pure_sdk\n\nloadFromFile() aceita File parameter (nao so default). saveToFile() cria timestamped file no Salvar. Limpar = screen only, nunca toca em arquivo salvo.", "cat": "padroes", "cl": "android"},{"id": "p-filename-artist-extraction-two-strategies", "label": "Filename artist extraction (two strategies)", "color": "#4e79a7", "size": 12, "title": "mp3player\n\nArtist 'Desconhecido'/'<unknown>': Strategy 1 = dash-separated (first segment is artist, last is channel), Strategy 2 = double-space separated (second segment is artist). Segment validated: 2-50 chars, at least one uppercase.", "cat": "padroes", "cl": "mp3player"},{"id": "p-itunes-search-with-scoring-thresholds", "label": "iTunes search with scoring thresholds", "color": "#4e79a7", "size": 12, "title": le-text-entry", "label": "Iframe/contenteditable text entry", "color": "#4e79a7", "size": 22, "title": "treinamento_navegacao\n\nContenteditable e iframes rich-text nao aceitam send_keys() diretamente; requer abordagem em 3 passos com selecao e substituicao", "cat": "padroes", "cl": "navegacao"},{"id": "p-shadow-dom-penetration", "label": "Shadow DOM penetration", "color": "#4e79a7", "size": 22, "title": "treinamento_navegacao\n\nComponentes Web com Shadow DOM encapsulam elementos; necessario atravessar cada shadowRoot manualmente", "cat": "padroes", "cl": "navegacao"},{"id": "p-stale-element-reference-recovery", "label": "Stale element reference recovery", "color": "#4e79a7", "size": 22, "title": "treinamento_navegacao\n\nPaginas dinamicas removem e readicionam elementos no DOM, invalidando referencias; re-busca pelo seletor original resolve na maioria dos casos", "cat": "padroes", "cl": "navegacao"},{"id": "p-lazy-loaded-content-detection", "label": "Lazy-loaded content detection", "color": "#4e79a7", "size": 22, "title": "treinamento_navegacao\n\nInfinite scroll e lazy loading sao onipresentes; scroll forcado dispara carregamento de conteudo oculto", "cat": "padroes", "cl": "navegacao"},{"id": "p-modaldialog-overlay-detection", "label": "Modal/dialog overlay detection", "color": "#4e79a7", "size": 22, "title": "treinamento_navegacao\n\nModais interceptam cliques e causam falhas misteriosas; detector preventivo evita ElementClickInterceptedException", "cat": "padroes", "cl": "navegacao"},{"id": "p-windows-ui-element-tree-traversal", "label": "Windows UI element tree traversal", "color": "#4e79a7", "size": 22, "title": "treinamento_navegacao\n\nAplicacoes Windows expoem arvore de acessibilidade UI Automation; AutomationId e o identificador mais estavel, Name pode mudar com localizacao", "cat": "padroes", "cl": "navegacao"},{"id": "p-win32-control-pattern-recognition", "label": "Win32 control pattern recognition", "color": "#4e79a7", "size": 22, "title": "treinamento_navegacao\n\nControles Win32 classicos tem padroes de interacao previsiveis; Edit aceita WM_SETTEXT, Button aceita BM_CLICK, ComboBox requer CB_SETCURSEL", "cat": "padroes", "cl": "navegacao"},{"id": "p-keyboard-only-navigation-fallback", "label": "Keyboard-only navigation fallback", "color": "#4e79a7", "size": 22, "title": "treinamento_navegacao\n\nAplicacoes podem reposicionar botoes; atalhos de teclado e navegacao por Tab sao independentes de layout", "cat": "padroes", "cl": "navegacao"},{"id": "p-windows-notificationballoon-dismissal", "label": "Windows notification/balloon dismissal", "color": "#4e79a7", "size": 22, "title": "treinamento_navegacao\n\nNotificacoes do Windows sobrepoem elementos e consomem foco do teclado; descarte preventivo evita interrupcoes", "cat": "padroes", "cl": "navegacao"},{"id": "p-process-hierarchy-for-multi-window-apps", "label": "Process hierarchy for multi-window apps", "color": "#4e79a7", "size": 22, "title": "treinamento_navegacao\n\nApps modernos (Electron, Chromium) tem multiplas janelas; busca por titulo parcial captura variacoes como ' - Chrome' ou ' - Notepad'", "cat": "padroes", "cl": "navegacao"},{"id": "p-android-view-hierarchy-scanning", "label": "Android View hierarchy scanning", "color": "#4e79a7", "size": 22, "title": "treinamento_navegacao\n\nViews Android tem resource-id (estavel), content-desc (acessibilidade), text (visivel), e class (tipo); resource-id e o mais confiavel", "cat": "padroes", "cl": "navegacao"},{"id": "p-android-gesture-patterns", "label": "Android gesture patterns", "color": "#4e79a7", "size": 22, "title": "treinamento_navegacao\n\nCoordenadas absolutas quebram entre dispositivos; calcular proporcionalmente a resolucao da tela para gestos consistentes", "cat": "padroes", "cl": "navegacao"},{"id": "p-miuihyperos-permission-dialogs", "label": "MIUI/HyperOS permission dialogs", "color": "#4e79a7", "size": 22, "title": "treinamento_navegacao\n\nMIUI/HyperOS tem dialogs de permissao adicionais alem do Android stock; necessario aceitar explicitamente", "cat": "padroes", "cl": "navegacao"},{"id": "p-android-keyboard-dismissal", "label": "Android keyboard dismissal", "color": "#4e79a7", "size": 22, "title": "treinamento_navegacao\n\nTeclado virtual sobrepoe metade da tela e esconde elementos; fechar antes de interagir com elementos abaixo", "cat": "padroes", "cl": "navegacao"},{"id": "p-packageactivity-launch-pattern", "label": "Package/activity launch pattern", "color": "#4e79a7", "size": 22, "title": "treinamento_navegacao\n\nMonkey e mais simples para launch basico; am start permite abrir activity especifica diretamente (pula tela inicial)", "cat": "padroes", "cl": "navegacao"},{"id": "p-ocr-fallback-para-elementos-sem-identificador", "label": "OCR fallback para elementos sem identificador", "color": "#4e79a7", "size": 22, "title": "treinamento_navegacao\n\nElementos renderizados como canvas, imagens ou emuladores de terminal nao expoem arvore de acessibilidade; OCR e o unico caminho", "cat": "padroes", "cl": "navegacao"},{"id": "p-template-matching-para-botoes-graficos", "label": "Template matching para botoes graficos", "color": "#4e79a7", "size": 22, "title": "treinamento_navegacao\n\nBotoes personalizados (icones, imagens) nao tem texto ou ID; template matching com correlacao normalizada e a abordagem mais robusta", "cat": "padroes", "cl": "navegacao"},{"id": "p-wait-strategy-adaptive", "label": "Wait strategy adaptive", "color": "#4e79a7", "size": 22, "title": "treinamento_navegacao\n\nTempos de espera fixos desperdicam segundos; adaptar ao tipo de operacao melhora velocidade sem sacrificar confiabilidade", "cat": "padroes", "cl": "navegacao"},{"id": "p-retry-com-backoff-exponencial", "label": "Retry com backoff exponencial", "color": "#4e79a7", "size": 22, "title": "treinamento_navegacao\n\nFalhas transitorias sao comuns; backoff exponencial nao sobrecarrega o sistema e da tempo para condicoes de corrida se resolverem", "cat": "padroes", "cl": "navegacao"},{"id": "p-mcp-json-rpc-notification-handling", "label": "MCP JSON-RPC notification handling", "color": "#4e79a7", "size": 11, "title": "session+session\n\nMCP server must NOT respond to JSON-RPC notifications (requests without id field). Check req_id = request.get(id) - if None, return None from handle_request and skip writing to stdout in run().", "cat": "padroes", "cl": "navegacao"},{"id": "p-mcp-toolscall-method-dispatch", "label": "MCP tools/call method dispatch", "color": "#4e79a7", "size": 11, "title": "session+session\n\nMCP v2024-11-05 uses tools/call method (not mcp.tools.call). Must implement _handle_tools_call that maps tool names to handlers.", "cat": "padroes", "cl": "navegacao"},{"id": "p-opencode-mcp-config-format", "label": "OpenCode MCP config format", "color": "#4e79a7", "size": 11, "title": "session+session\n\nOpenCode MCP config mcp field must be an array of objects, not a single object", "cat": "padroes", "cl": "navegacao"},{"id": "p-workspace-organization", "label": "Workspace organization", "color": "#4e79a7", "size": 11, "title": "session+session\n\nWorkspace organization: use single root Desktop\\Codigos\\ with subfolders Android/, AI-Agents/, Ferramentas/, Documentos/, Midia/, Scripts/; Use single root Desktop\\Codigos\\ with subfolders Android/, AI-Agents/, Ferramentas/, Documentos/, Midia/, Scripts/", "cat": "padroes", "cl": "navegacao"},{"id": "p-config-2026-07-27-teste-do-vigilante-automático", "label": "Config: 2026-07-27: Teste do vigilante automático", "color": "#4e79a7", "size": 10, "title": "opencode+opencode+opencode\n\n# 2026-07-27: Teste do vigilante automático\n\n**Categoria:** config\n**Contexto:** Teste do sistema de vigilância automática do ecossistema\n**Agentes envolvidos:** Maestro, Vigilante\n\n## Teste\n\nVerificar se o vigilante detecta automaticamente novos arquivos em conhecimento/aprendizados/, registra no K", "cat": "padroes", "cl": "ecossistema"},{"id": "p-config-2026-07-27-4-teste-do-ciclo-de-polling", "label": "Config: 2026-07-27-4: Teste do ciclo de polling", "color": "#4e79a7", "size": 10, "title": "opencode+opencode\n\n# 2026-07-27-4: Teste do ciclo de polling\n\n**Categoria:** config\n**Contexto:** Verificar se o vigilante detecta arquivos novos em tempo real\n**Agentes envolvidos:** Vigilante\n\n## Teste\n\nCriado manualmente enquanto o vigilante está rodando para verificar se o polling de 30s detecta.\n", "cat": "padroes", "cl": "ecossistema"},{"id": "p-config-2026-07-27-5-teste-final-do-vigilante-em-processo-rea", "label": "Config: 2026-07-27-5: Teste final do vigilante em processo real", "color": "#4e79a7", "size": 10, "title": "opencode\n\n# 2026-07-27-5: Teste final do vigilante em processo real\n\n**Categoria:** config\n**Contexto:** Verificar detecção em processo Windows real (não background job)\n**Agentes envolvidos:** Vigilante\n\n## Teste\n\nCriado enquanto vigilante roda como processo Windows oculto.\n", "cat": "padroes", "cl": "ecossistema"},{"id": "p-encoding-utf-8-explicito-em-python-no-windows", "label": "Encoding UTF-8 explicito em Python no Windows", "color": "#4e79a7", "size": 11, "title": "ler_aprendizado\n\nSempre usar encoding=utf-8 em open() no Windows para evitar falsos diagnosticos de corrupcao em arquivos JSON", "cat": "padroes", "cl": "ler"},{"id": "p-registro-de-habilidades-de-jarvis", "label": "Registro de Habilidades de Jarvis", "color": "#4e79a7", "size": 11, "title": "ler_aprendizado\n\nCriado registro permanente de 80+ habilidades de Jarvis no JARVIS_SYSTEM.md, categorizadas em 8 grupos funcionais", "cat": "padroes", "cl": "ler"},{"id": "p-taxonomia-correta-de-habilidades-jarvis", "label": "Taxonomia correta de habilidades Jarvis", "color": "#4e79a7", "size": 11, "title": "ler_aprendizado\n\nHabilidade = capacidade verificavel com implementacao em codigo. Distinguir de ferramenta, conhecimento, skill. 3 niveis: fundamental, composta, dominio.", "cat": "padroes", "cl": "ler"},{"id": "d-ler-usa-python-puro-stdlib-only-zero-dependencias-externas-i", "label": "LER usa Python puro (stdlib only) — zero dependencias externas intencionalmente.", "color": "#f28e2b", "size": 11, "title": "ler_arquitetura\n\nPortabilidade maxima, sem conflitos de versao, instalavel em qualquer ambiente com Python.", "cat": "decisoes", "cl": "ler"},{"id": "d-estado-persiste-em-json-nao-sqlite-legivel-editavel-fora-do-", "label": "Estado persiste em JSON (nao SQLite) — legivel, editavel fora do LER, sem migrations.", "color": "#f28e2b", "size": 11, "title": "ler_arquitetura\n\nMesma razao do Android Pure SDK: JSON e human-readable, debuggavel, versionavel no git.", "cat": "decisoes", "cl": "ler"},{"id": "d-checkpoints-salvos-antes-de-cada-iteracao-sobrevive-a-crash-", "label": "Checkpoints salvos antes de cada iteracao — sobrevive a crash a qualquer momento.", "color": "#f28e2b", "size": 11, "title": "ler_arquitetura\n\nMissao nunca recomeca do zero. restart/resume carrega ultimo checkpoint viavel.", "cat": "decisoes", "cl": "ler"},{"id": "d-pontuacao-ponderada-com-6-categorias-req-30-func-30-testes-1", "label": "Pontuacao ponderada com 6 categorias (Req 30%, Func 30%, Testes 10%, DoD 10%, Evidencias 10%, Auditoria 10%).", "color": "#f28e2b", "size": 11, "title": "ler_arquitetura\n\nDoD granular com dod_satisfaction forcando verificacao de git commit + passos completados.", "cat": "decisoes", "cl": "ler"},{"id": "d-estrategia-selecionada-por-ranking-cost-risk-time-complexity", "label": "Estrategia selecionada por ranking (cost + risk + time + complexity + success_probability).", "color": "#f28e2b", "size": 11, "title": "ler_arquitetura\n\nEstrategias falhas nunca repetidas sem alteracoes. Forca variacao de abordagem.", "cat": "decisoes", "cl": "ler"},{"id": "d-supervisor-monitora-todos-os-modulos-individualmente-nunca-r", "label": "Supervisor monitora todos os modulos individualmente — nunca reinicia missao inteira por falha de um modulo.", "color": "#f28e2b", "size": 11, "title": "ler_arquitetura\n\nIsolamento de falha: se localhostporta-em-vez-de-s", "label": "Server health check via HTTP ping (localhost:porta) em vez de stdin/stdout", "color": "#f28e2b", "size": 10, "title": "sessao_servermanager\n\nHTTP permite verificar se processo esta vivo mesmo com threads ocupadas; mais confiavel", "cat": "decisoes", "cl": "ecossistema"},{"id": "d-salvar-rustdesk-password-e-id-em-local-permanente-nao-gerar-", "label": "Salvar RustDesk password e ID em local permanente, nao gerar OTP", "color": "#f28e2b", "size": 10, "title": "sessao_rustdesk\n\nAcesso remoto previsivel requer credenciais fixas, nao one-time tokens que mudam", "cat": "decisoes", "cl": "ecossistema"},{"id": "d-priorizar-data-testid-sobre-classes-css-em-automacao-web", "label": "Priorizar data-testid sobre classes CSS em automacao web", "color": "#f28e2b", "size": 22, "title": "treinamento_navegacao\n\ndata-testid e o unico atributo projetado exclusivamente para automacao; classes CSS mudam com refactors de estilo, IDs sao frequentemente dinamicos", "cat": "decisoes", "cl": "navegacao"},{"id": "d-usar-coordenadas-relativas-porcentagem-em-vez-de-absolutas-p", "label": "Usar coordenadas relativas (porcentagem) em vez de absolutas para gestos mobile", "color": "#f28e2b", "size": 22, "title": "treinamento_navegacao\n\nDispositivos Android tem resolucoes variadas; coordenadas relativas adaptam-se automaticamente sem recalculo manual", "cat": "decisoes", "cl": "navegacao"},{"id": "d-preferir-automationid-sobre-name-em-ui-automation-windows", "label": "Preferir AutomationId sobre Name em UI Automation Windows", "color": "#f28e2b", "size": 22, "title": "treinamento_navegacao\n\nName de controles Windows muda com idioma do sistema operacional e versoes do app; AutomationId e estavel entre versoes", "cat": "decisoes", "cl": "navegacao"},{"id": "d-verificar-modais-antes-de-cada-interacao", "label": "Verificar modais antes de cada interacao", "color": "#f28e2b", "size": 22, "title": "treinamento_navegacao\n\nModais e dialogs interceptam cliques e causam ElementClickInterceptedException; verificacao preventiva evita retries desnecessarios", "cat": "decisoes", "cl": "navegacao"},{"id": "d-usar-keyboard-shortcuts-como-fallback-universal", "label": "Usar keyboard shortcuts como fallback universal", "color": "#f28e2b", "size": 22, "title": "treinamento_navegacao\n\nAtalhos de teclado funcionam independentemente de layout, tema, zoom, ou resolucao; sao o denominador comum entre todas as plataformas", "cat": "decisoes", "cl": "navegacao"},{"id": "d-sempre-fechar-teclado-virtual-android-antes-do-proximo-cliqu", "label": "Sempre fechar teclado virtual Android antes do proximo clique", "color": "#f28e2b", "size": 22, "title": "treinamento_navegacao\n\nTeclado ocupa 30-50% da tela e intercepta toques; fecha-lo preventivamente reduz falhas de interacao em 70%", "cat": "decisoes", "cl": "navegacao"},{"id": "d-usar-ocr-como-fallback-final-nao-primario", "label": "Usar OCR como fallback final, nao primario", "color": "#f28e2b", "size": 22, "title": "treinamento_navegacao\n\nOCR e 10-100x mais lento que seletores diretos e sujeito a falsos positivos; usar apenas quando arvore de acessibilidade nao existe", "cat": "decisoes", "cl": "navegacao"},{"id": "d-mudar-config-mcp-de-objeto-para-array-no-opencodejson", "label": "Mudar config MCP de objeto para array no opencode.json", "color": "#f28e2b", "size": 10, "title": "provider_mcp_debug\n\nSchema v1.17.14 exige array", "cat": "decisoes", "cl": "ecossistema"},{"id": "d-organizar-desktopcodigos-como-raiz-unica-de-projetos", "label": "Organizar Desktop\\Codigos\\ como raiz unica de projetos", "color": "#f28e2b", "size": 10, "title": "workspace_organization\n\nEvitar dispersao de projetos pelo Desktop e Documentos", "cat": "decisoes", "cl": "ecossistema"},{"id": "d-renomear-pastas-com-espacos-para-nomes-sem-espaco", "label": "Renomear pastas com espacos para nomes sem espaco", "color": "#f28e2b", "size": 10, "title": "workspace_organization\n\nEvitar bugs em scripts PowerShell que nao escapam caminhos", "cat": "decisoes", "cl": "ecossistema"},{"id": "d-2026-07-27-sistema-automático-de-captura-de-conhecimento-do-", "label": "2026-07-27: Sistema automático de captura de conhecimento do ecossistema", "color": "#f28e2b", "size": 10, "title": "ecosistema-opencode\n\n# 2026-07-27: Sistema automático de captura de conhecimento do ecossistema\n\n**Categoria:** decisao\n**Contexto:** Implementação das três camadas de aprendizado contínuo para o ecossistema OpenCode + LER\n**Agentes envolvidos:** Maestro, Aprendizado\n\n## Decisão\n\nCriamos um sistema de três camadas para garantir que todo aprendizado do ecossistema seja automaticamente capturado, persistido e reutilizado:\n\n1. **Base de conhecimento local** (`EcoSystemUmGrau/conhecimento/`) — entradas markdown com metadados, categorizadas em aprendizados, decisões e padrões\n2. **Agente 10-Aprendizado** — subagente OpenCode invocado pelo Maestro ao final de toda tarefa para extrair conhecimento estruturado da conversa\n3. **Ponte LER** (`knowledge_bridge.py`) — sincroniza automaticamente os aprendizados com o `CONHECIMENTO.md` e `knowledge_graph.json` do LER\n\n## Por quê\n\nAntes desta implementação, cada interação com o ecossistema gerava conhecimento que era perdido após o término da sessão. Não havia:\n- Persistência estruturada de decisões e padrões\n- Contexto compartilhado entre sessões\n- Alimentação automática do LER com aprendizados do OpenCode\n\n## Impacto\n\n- Toda interação agora deixa um registro permanente\n- O LER é alimentado automaticamente sem intervenção manual\n- Novas sessões carregam todo o histórico de aprendizado via `instructions` do `opencode.jsonc`\n- O ecossistema se torna auto-documentante\n\n## Referências\n\n- `~/.config/opencode/agents/10-aprendizado.md`\n- `~/.config/opencode/agents/00-maestro.md` (fluxo obrigatório atualizado)\n- `EcoSystemUmGrau/conhecimento/INDEX.md`\n- `~/.ler/integrations/opencode/knowledge_bridge.py`\n", "cat": "decisoes", "cl": "geral"},{"id": "d-2026-07-27-fallback-automático-de-modelo-llm-com-bun-razrooo", "label": "2026-07-27: Fallback automático de modelo LLM com Bun + @razroo/opencode-model-fallback", "color": "#f28e2b", "size": 10, "title": "ecosistema-opencode\n\n# 2026-07-27: Fallback automático de modelo LLM com Bun + @razroo/opencode-model-fallback\n\n**Categoria:** decisao\n**Contexto:** Necessidade de fallback automático quando o modelo primário do OpenCode bate limite de uso\n**Agentes envolvidos:** Maestro\n\n## Decisão\n\nInstalamos Bun 1.3.14 e o plugin `@razroo/opencode-model-fallback` v0.3.2 para fallback automático de modelos LLM no OpenCode.\n\n- Plugin adicionado ao `opencode.jsonc`\n- Config global em `opencode-model-fallback.jsonc` com fallback para `nvidia/deepseek-ai/deepseek-v3.1`\n- Cooldown de 60s com auto-recovery\n- Notificações toast ativadas\n\n## Por quê\n\nO OpenCode 1.18.7 não suporta fallback nativo (PR #26292 ainda em andamento). A alternativa de troca manual via `/model` no TUI interrompe o fluxo de trabalho. O plugin da comunidade resolve isso com detecção automática de rate limits, quota errors e timeouts TTFT.\n\n## Impacto\n\n- Zero downtime quando o modelo primário atinge limite\n- Troca transparente com replay automático da última mensagem\n- Volta ao modelo primário automaticamente após cooldown\n- Bun adicionado como runtime adicional no ecossistema\n\n## Referências\n\n- `~/.config/opencode/opencode.jsonc` (plugin array)\n- `~/.config/opencode/opencode-model-fallback.jsonc`\n- `~/.config/opencode/node_modules/@razroo/opencode-model-fallback/`\n", "cat": "decisoes", "cl": "geral"},{"id": "d-2026-07-28-cláusula-pétrea-toda-alteração-no-ecossistema-dev", "label": "2026-07-28: Cláusula Pétrea — Toda alteração no ecossistema deve ser testada antes de aplicar", "color": "#f28e2b", "size": 10, "title": "opencode\n\n# 2026-07-28: Cláusula Pétrea — Toda alteração no ecossistema deve ser testada antes de aplicar\n\n**Categoria:** decisao\n**Contexto:** Adição de servidores MCP via npx quebraram a inicialização do OpenCode. Ao reiniciar, os modelos não carregavam → sistema inutilizável. O usuário precisou apagar arquivos manualmente para recuperar.\n**Gravidade:** CRÍTICA — impeditiva, sem diagnóstico visível\n\n## Decisão\n\nEstabelecemos a **Cláusula Pétrea de Resiliência**: nenhuma alteração em config, MCP, plugins ou agents pode ser aplicada sem passar por validação prévia.\n\n## Mecanismos criados\n\n1. **Triângulo da Resiliência** (testar sempre antes de aplicar):\n   - Teste de INIT: MCP server responde `initialize` sem travar?\n   - Teste de TOOLS: servidores expõem tools válidas?\n   - Teste de JSON: config gerado é JSON válido?\n   - Teste de ESTRUTURA: todos os campos obrigatórios existem?\n\n2. **Pre-flight check automático** (`scripts/preflight_check.py`):\n   - Valida JSON do config template antes de deploy\n   - Testa cada MCP server com initialize + tools/list\n   - Verifica se providers, plugins e instructions estão íntegros\n   - Só aplica se TODOS os testes passarem\n\n3. **Vigilante com guard rail**:\n   - Antes de deployar config, executa preflight\n   - Se falhar: loga erro, NÃO aplica, notifica\n   - Rollback automático para última config válida\n\n4. **Agentes com cláusula pétrea**:\n   - `00-system-rules.md`: constituição — \"testar antes de aplicar\" é regra imutável\n   - `00-maestro.md`: passo obrigatório — validar antes de implementar\n   - `08-revisor.md`: gate de qualidade que verifica preflight\n\n## Trigger\n\nSempre que qualquer alteração for feita em:\n- `config/opencode.jsonc` (template)\n- `config/agents/*.md`\n- `scripts/mcp-*-server.py`\n- `plugins/*`\n- `config/opencode-model-fallback.jsonc`\n\n## Próximos passos\n\n1. Criar `scripts/preflight_check.py`\n2. Integrar no vigilante\n3. Atualizar system-rules e Maestro\n4. Testar ciclo: alterar config → preflight barra → rollback\n", "cat": "decisoes", "cl": "ecossistema"},{"id": "d-jarvis-deve-manter-registro-de-suas-proprias-habilidades-em-", "label": "Jarvis deve manter registro de suas proprias habilidades em JARVIS_SYSTEM.md", "color": "#f28e2b", "size": 11, "title": "ler_aprendizado\n\nO usuario explicitamente pediu um campo de habilidades catalogando todas as capacidades de Jarvis para referencia futura", "cat": "decisoes", "cl": "ler"},{"id": "d-habilidades-de-jarvis-seguem-taxonomia-de-3-niveis", "label": "Habilidades de Jarvis seguem taxonomia de 3 niveis", "color": "#f28e2b", "size": 11, "title": "ler_aprendizado\n\nA primeira versao misturava ferramentas, conhecimentos e capacidades. A versao correta alinha com a taxonomia do ecossistema.", "cat": "decisoes", "cl": "ler"},{"id": "b-maxiterations-hard-stop-forca-parada-prematura-mesmo-sem-obj", "label": "max_iterations hard stop forca parada prematura mesmo sem objetivo atingido", "color": "#e15759", "size": 12, "title": "ler_auditoria\n\nLoop principal usava while self.iteration < self.max_iterations (100) como criterio de saida, ignorando se o objetivo foi alcancado", "cat": "bugs", "cl": "ler"},{"id": "b-score-threshold-mas-sem-failedsteps-ia-direto-para-successve", "label": "Score < threshold mas sem failed_steps ia direto para SUCCESS_VERIFIED", "color": "#e15759", "size": 12, "title": "ler_auditoria\n\n_phase_success_eval verificava apenas failed_steps, nao o score real. Se todos steps 'completaram' com bugs, LER considerava sucesso.", "cat": "bugs", "cl": "ler"},{"id": "b-executor-nao-validava-resultado-real-da-implementacao", "label": "Executor nao validava resultado real da implementacao", "color": "#e15759", "size": 12, "title": "ler_auditoria\n\n_action_implement retornava string fixa sem verificar se arquivos foram modificados. _action_test so reportava numero de testes sem all_passed.", "cat": "bugs", "cl": "ler"},{"id": "b-nao-havia-feedback-loop-do-usuario-ler-terminava-mesmo-se-ob", "label": "Nao havia feedback loop do usuario — LER terminava mesmo se objetivo nao fosse atingido", "color": "#e15759", "size": 12, "title": "ler_auditoria\n\nCOMPLETED -> _finalize direto, sem perguntar ao usuario se o resultado foi satisfatorio", "cat": "bugs", "cl": "ler"},{"id": "b-persistencia-sem-atomicidade-crash-no-meio-do-jsondump-corro", "label": "Persistencia sem atomicidade — crash no meio do json.dump corrompia arquivo", "color": "#e15759", "size": 12, "title": "ler_auditoria\n\nEscrita direta com json.dump() sem arquivo temporario", "cat": "bugs", "cl": "ler"},{"id": "b-logs-sem-rotacao-logs-cresciam-indefinidamente", "label": "Logs sem rotacao — logs cresciam indefinidamente", "color": "#e15759", "size": 12, "title": "ler_auditoria\n\nSession.log escrevia sempre no mesmo arquivo sem limite de tamanho", "cat": "bugs", "cl": "ler"},{"id": "b-executorresults-sem-limite-memoria-crescia-indefinidamente", "label": "Executor.results sem limite — memoria crescia indefinidamente", "color": "#e15759", "size": 12, "title": "ler_auditoria\n\nresults dict acumulava resultados sem nunca remover entradas antigas", "cat": "bugs", "cl": "ler"},{"id": "b-code-duplication-entre-checkpointpy-e-persistencepy-200-linh", "label": "Code duplication entre checkpoint.py e persistence.py (~200 linhas duplicadas)", "color": "#e15759", "size": 12, "title": "ler_auditoria\n\nDuas implementacoes paralelas de save/load JSON com logica identica", "cat": "bugs", "cl": "ler"},{"id": "b-artist-shows-desconhecido", "label": "Artist shows \"Desconhecido\"", "color": "#e15759", "size": 21, "title": "mp3player-metadata-rescue\n\nYouTube MP3s have no ID3 tags", "cat": "bugs", "cl": "mp3player"},{"id": "b-search-returns-wrong-artist", "label": "Search returns wrong artist", "color": "#e15759", "size": 21, "title": "mp3player-metadata-rescue\n\niTunes BR returns irrelevant results", "cat": "bugs", "cl": "mp3player"},{"id": "b-album-art-not-found", "label": "Album art not found", "color": "#e15759", "size": 21, "title": "mp3player-metadata-rescue\n\nCover Art Archive redirect to archive.org fails", "cat": "bugs", "cl": "mp3player"},{"id": "b-logs-dont-appear", "label": "Logs don't appear", "color": "#e15759", "size": 21, "title": "mp3player-metadata-rescue\n\nMIUI logcat filtering", "cat": "bugs", "cl": "mp3player"},{"id": "b-filename-ambiguity", "label": "Filename ambiguity", "color": "#e15759", "size": 21, "title": "mp3player-metadata-rescue\n\nMultiple filename formats", "cat": "bugs", "cl": "mp3player"},{"id": "b-acoustid-always-fails", "label": "AcoustID always fails", "color": "#e15759", "size": 21, "title": "mp3player-metadata-rescue\n\nInvalid API key `4m9Q2k9p` (HTTP 400)", "cat": "bugs", "cl": "mp3player"},{"id": "b-first-search-returns-nothing", "label": "First search returns nothing", "color": "#e15759", "size": 21, "title": "mp3player-metadata-rescue\n\nWrong artist extracted from filename, or title too noisy", "cat": "bugs", "cl": "mp3player"},{"id": "b-user-sees-wrongshort-results", "label": "User sees wrong/short results", "color": "#e15759", "size": 21, "title": "mp3player-metadata-rescue\n\nScoring rejected borderline-but-correct match", "cat": "bugs", "cl": "mp3player"},{"id": "b-audio-stops-eq-not-audible", "label": "**Audio stops / EQ not audible**", "color": "#e15759", "size": 21, "title": "mp3player-metadata-rescue\n\n`EqualizerAudioProcessor.queueInput()` never calls `inputBuffer.position(inputBuffer.limit())` after processing. ExoPlayer sees 0 bytes consumed → audio pipeline stalls. Also `isActive()` was initiall", "cat": "bugs", "cl": "mp3player"},{"id": "b-preset-not-persisting-across-sessions", "label": "**Preset not persisting across sessions**", "color": "#e15759", "size": 21, "title": "mp3player-metadata-rescue\n\nThe preamp was baked into `currentGains[]` making it irreversible. `syncSoftwareEq()` passed preamp=0 to processor so preamp was never audible.", "cat": "bugs", "cl": "mp3player"},{"id": "b-preamp-volume-irreversible-and-cumulative", "label": "**Preamp volume irreversible and cumulative**", "color": "#e15759", "size": 21, "title": "mp3player-metadata-rescue\n\n`showVolumeDialog()` did `currentGains[i] += v` on already-baked gains. Each call added more, preamp could never be undone without reset.", "cat": "bugs", "cl": "mp3player"},{"id": "b-preamp-not-audible", "label": "**Preamp not audible**", "color": "#e15759", "size": 21, "title": "mp3player-metadata-rescue\n\n`syncSoftwareEq()` always called `mp.setEqPreampGain(0f)`, ignoring `currentPreamp`. The preamp was only baked into HW EQ gains, never sent to software EQ.", "cat": "bugs", "cl": "mp3player"},{"id": "b-duplicate-mini-player-on-some-screens", "label": "**Duplicate mini-player on some screens**", "color": "#e15759", "size": 21, "title": "mp3player-metadata-rescue\n\n`openNowPlaying()` could be called multiple times, adding duplicate fragments.", "cat": "bugs", "cl": "mp3player"},{"id": "b-eq-distorts-audio-at-boost-settings", "label": "**EQ distorts audio at boost settings**", "color": "#e15759", "size": 21, "title": "mp3player-metadata-rescue\n\n20 cascaded peaking filters + preamp can push signal past 1.0. `coerceIn(-1f, 1f)` causes hard clipping distortion.", "cat": "bugs", "cl": "mp3player"},{"id": "b-preset-data-corrupted-on-ptbr-locale", "label": "**Preset data corrupted on pt_BR locale**", "color": "#e15759", "size": 21, "title": "mp3player-metadata-rescue\n\n`\"%.1f\".format(-4.0)` produces `\"-4,0\"` (comma decimal) on Brazilian locale. `joinToString(\",\")` uses same comma → data splits into 2x the expected parts.", "cat": "bugs", "cl": "mp3player"},{"id": "b-eq-still-distorts-at-high-boost", "label": "**EQ still distorts at high boost**", "color": "#e15759", "size": 21, "title": "mp3player-metadata-rescue\n\n`tanh()` soft-clipping alone insufficient — 20 cascaded peaking filters + preamp can produce cumulative gain >> 6 dB at certain frequencies, exceeding `tanh()` saturation threshold.", "cat": "bugs", "cl": "mp3player"},{"id": "b-no-eq-onoff-button", "label": "**No EQ on/off button**", "color": "#e15759", "size": 21, "title": "mp3player-metadata-rescue\n\nUser had no way to bypass EQ without resetting all gains to zero.", "cat": "bugs", "cl": "mp3player"},{"id": "b-no-visual-limiting-feedback", "label": "**No visual limiting feedback**", "color": "#e15759", "size": 21, "title": "mp3player-metadata-rescue\n\nUser couldn't see when limiter was active or how much reduction was applied.", "cat": "bugs", "cl": "mp3player"},{"id": "b-eq-state-not-persisted", "label": "**EQ state not persisted**", "color": "#e15759", "size": 21, "title": "mp3player-metadata-rescue\n\nEQ enabled/disabled state not saved to SharedPreferences — switch reset to ON on every restart.", "cat": "bugs", "cl": "mp3player"},{"id": "b-no-most-played-tracking", "label": "**No most-played tracking**", "color": "#e15759", "size": 21, "title": "mp3player-metadata-rescue\n\nApp had no mechanism to count or sort by play frequency.", "cat": "bugs", "cl": "mp3player"},{"id": "b-eq-only-applies-after-opening-fragment", "label": "**EQ only applies after opening fragment**", "color": "#e15759", "size": 21, "title": "mp3player-metadata-rescue\n\nSaved gains/preamp never loaded into processor until `EqualizerFragment.loadActivePreset()` runs. Playing a song without opening EQ meant processor stayed flat.", "cat": "bugs", "cl": "mp3player"},{"id": "b-eq-deactivates-on-song-change", "label": "**EQ deactivates on song change**", "color": "#e15759", "size": 21, "title": "mp3player-metadata-rescue\n\n`AudioProcessor.reset()` set `isActiveState = false` and `configure()` never recalculated it. ExoPlayer calls `reset()` between songs → processor silently bypassed.", "cat": "bugs", "cl": "mp3player"},{"id": "b-eq-toggle-button-not-visible", "label": "**EQ toggle button not visible**", "color": "#e15759", "size": 21, "title": "mp3player-metadata-rescue\n\n`Switch` widget may not render correctly on some MIUI versions or was too small to notice.", "cat": "bugs", "cl": "mp3player"},{"id": "b-track-the-best-score-across-all-results-and-only-return-if-m", "label": "** Track the best score across all results and only return if minimum threshold is met. Perfect matc", "color": "#e15759", "size": 21, "title": "mp3player-metadata-rescue\n\n", "cat": "bugs", "cl": "mp3player"},{"id": "b-use-explicit-redirect-following-in-download-function-manual-", "label": "** Use explicit redirect following in download function (manual loop for 3xx codes)", "color": "#e15759", "size": 21, "title": "mp3player-metadata-rescue\n\n", "cat": "bugs", "cl": "mp3player"},{"id": "b-opencode-go-provider-crash-ao-processar-mensagem", "label": "OpenCode Go provider crash ao processar mensagem", "color": "#e15759", "size": 11, "title": "sessao_providermanager\n\n_simulate_completion() tratava request.messages[-1] como dict sempre, mas ultima msg pode ser string", "cat": "bugs", "cl": "ecossistema"},{"id": "b-mcp-server-nao-respondia-nenhum-comando", "label": "MCP server nao respondia nenhum comando", "color": "#e15759", "size": 11, "title": "sessao_providermanager\n\nFaltava handler para metodo initialize, que e obrigatorio no protocolo MCP", "cat": "bugs", "cl": "ecossistema"},{"id": "b-authjson-com-entradas-de-chave-nvidia-disfarcadas-de-outros-", "label": "auth.json com entradas de chave NVIDIA disfarcadas de outros provedores", "color": "#e15759", "size": 10, "title": "sessao_limpeza_auth\n\nauth.json continha 5 entradas, 2 com chaves nvapi-... mascaradas como deepseek-ai e outra", "cat": "bugs", "cl": "ecossistema"},{"id": "b-cliques-falhando-em-spa-apos-navegacao", "label": "Cliques falhando em SPA apos navegacao", "color": "#e15759", "size": 22, "title": "treinamento_navegacao\n\nStale element reference: o DOM foi substituido pelo React/Vue mas a referencia ao elemento antigo permanece", "cat": "bugs", "cl": "navegacao"},{"id": "b-sendkeys-nao-funciona-em-campos-rich-text", "label": "send_keys nao funciona em campos rich-text", "color": "#e15759", "size": 22, "title": "treinamento_navegacao\n\nContenteditable e iframes rich-text nao tem input visivel; eventos de teclado nao sao processados", "cat": "bugs", "cl": "navegacao"},{"id": "b-elementos-nao-encontrados-em-shadow-dom", "label": "Elementos nao encontrados em Shadow DOM", "color": "#e15759", "size": 22, "title": "treinamento_navegacao\n\nShadow DOM encapsula elementos; querySelector normal nao penetra shadowRoots", "cat": "bugs", "cl": "navegacao"},{"id": "b-cliques-em-coordenadas-erram-alvo-em-resolutions-diferentes", "label": "Cliques em coordenadas erram alvo em resolutions diferentes", "color": "#e15759", "size": 22, "title": "treinamento_navegacao\n\nCoordenadas absolutas nao escalam entre dispositivos ou janelas redimensionadas", "cat": "bugs", "cl": "navegacao"},{"id": "b-permission-dialogs-do-miui-bloqueiam-instalacao-de-apk", "label": "Permission dialogs do MIUI bloqueiam instalacao de APK", "color": "#e15759", "size": 22, "title": "treinamento_navegacao\n\nMIUI/HyperOS adiciona dialogs de permissao apos instalacao que nao existem no Android AOSP", "cat": "bugs", "cl": "navegacao"},{"id": "b-dropdownselect-nao-responde-a-sendkeys-ou-click", "label": "Dropdown<select> nao responde a send_keys ou click", "color": "#e15759", "size": 22, "title": "treinamento_navegacao\n\nSelects estilizados (custom dropdowns) substituem o elemento <select> nativo por uma div com opcoes ocultas", "cat": "bugs", "cl": "navegacao"},{"id": "b-mcp-server-failed-to-get-tools-no-opencode", "label": "MCP server Failed to get tools no OpenCode", "color": "#e15759", "size": 10, "title": "provider_mcp_server.py:52-55\n\nServer respondia a notifications JSON-RPC (requests sem id), quebrando protocolo", "cat": "bugs", "cl": "ecossistema"},{"id": "b-mcp-server-nao-respondia-a-toolscall", "label": "MCP server nao respondia a tools/call", "color": "#e15759", "size": 10, "title": "provider_mcp_server.py\n\nMethod tools/call nao estava no dispatch de handle_request()", "cat": "bugs", "cl": "ecossistema"},{"id": "cog-debugging-em-cascata-reversa", "label": "Debugging em cascata reversa", "color": "#59a14f", "size": 14, "title": "Dominio: debugging\n\nQuando um bug nao tem causa obvia, comeca pela saida (sintoma) e traca o caminho inverso ate a entrada. Para cada passo, pergunte: 'Se este componente funcionasse corretamente, o que eu veria?' Quando a resposta nao corresponde a realidade, voce encontrou o componente defeituoso. Mais eficiente que debugar pra frente porque elimina ramos inteiros da arvore de causas.\n\nQuando metodo A falha, nao repetir A - descer para metodo B imediatamente. Ex: click() falhou? Tenta keyboard. Keyboard falhou? Tenta JS executor. JS falhou? Tenta OCR. Cada nivel e mais lento mas mais robusto\n\nQuando um cliente diz connected mas ferramentas nao funcionam, o problema geralmente esta no handshake ou na violacao de protocolo - nao na conexao em si. Testar com sequencia manual (initialize -> notification -> tools/list) isola o problema.", "cat": "cognitivo", "cl": "geral"},{"id": "cog-hipotese-falsificacao-terminal", "label": "Hipotese-falsificacao terminal", "color": "#59a14f", "size": 14, "title": "Dominio: debugging\n\nPara cada hipotese de causa, execute o experimento MAIS RAPIDO que pode FALSIFICA-LA, nao confirma-la. Se a hipotese for 'o arquivo X nao foi carregado', nao verifique se X foi carregado (confirmacao), mas sim INTRODUZA UM ERRO OBVIO em X e veja se o sintoma muda (falsificacao). Isso eviesa para descobrir a verdade rapidamente em vez de acumular evidencias confirmatorias.", "cat": "cognitivo", "cl": "geral"},{"id": "cog-lei-de-postel-aplicada-a-engenharia", "label": "Lei de Postel aplicada a engenharia", "color": "#59a14f", "size": 10, "title": "Dominio: architecture\n\n'Seja conservador no que voce envia, seja liberal no que voce aceita.' Outputs devem ser rigorosos (validacao estrita, tipos fortes, contratos explicitos). Inputs devem ser tolerantes (defaults, fallbacks, parsing flexivel). Isso cria sistemas que funcionam com peers imperfeitos sem propagar erros. Exemplo pratico: seu modulo deve falhar ruidosamente em erros internos mas silenciosamente em erros externos recuperaveis.", "cat": "cognitivo", "cl": "geral"},{"id": "cog-principio-da-separacao-causa-efeito-temporal", "label": "Principio da separacao causa-efeito-temporal", "color": "#59a14f", "size": 14, "title": "Dominio: debugging\n\nEm sistemas distribuidos ou assincronos, a CAUSA de um bug pode ter ocorrido muito antes do EFEITO ser observado. Nao procure perto do sintoma. Trace estados globais (logs, snapshots, checkpoints) para encontrar quando o estado correto foi violado, nao quando o erro foi reportado. Exemplo: crash no ExoPlayer 30s apos iniciar musica pode ser causado por configuracao do Equalizer que foi aplicada no momento 0.", "cat": "cognitivo", "cl": "geral"},{"id": "cog-estrategia-de-fallback-em-cadeia-chain-of-responsibility", "label": "Estrategia de fallback em cadeia (Chain of Responsibility)", "color": "#59a14f", "size": 11, "title": "Dominio: system_design\n\nQuando uma operacao tem multiplas fontes de dados possiveis, organize-as em ordem de preferencia (mais precisa primeiro) com fallback automatico para a proxima. Cada fonte deve reportar claramente se conseguiu ou nao. Nao pare no primeiro resultado — avalie todos e escolha o melhor. Exemplo: MetadataSearch usa AcoustID (fingerprint) -> iTunes BR (scoring) -> MusicBrainz (detalhado) -> iTunes US (fallback).", "cat": "cognitivo", "cl": "geral"},{"id": "cog-validacao-contra-intuitiva-teste-o-erro-nao-o-acerto", "label": "Validacao contra-intuitiva: teste o erro, nao o acerto", "color": "#59a14f", "size": 10, "title": "Dominio: testing\n\nPara cada funcao, o teste mais valioso nao e o 'caminho feliz' mas sim: (1) entrada vazia/nula, (2) entrada no limite, (3) entrada fora do dominio, (4) estado inconsistente, (5) concorrencia. Se sua funcao lida com arquivos: arquivo inexistente, permissao negada, disco cheio, arquivo corrompido. 80% dos bugs estao nos 20% de casos de erro.", "cat": "cognitivo", "cl": "geral"},{"id": "cog-padrao-de-escrita-atomica-para-persistencia", "label": "Padrao de escrita atomica para persistencia", "color": "#59a14f", "size": 11, "title": "Dominio: system_design\n\nNUNCA escreva diretamente no arquivo final. Escreva em um arquivo temporario (.tmp) e use rename atomico (os.replace() no Python, MoveFileEx on Windows, mv no Linux). O rename e atomico a nivel de sistema de arquivos em NTFS e ext4: ou o arquivo inteiro aparece, ou o antigo permanece. SEMPRE. Isso previne corrupcao por crash no meio da escrita. Leitura: se o .tmp existe e o final nao, ignore o .tmp (escrita abortada).", "cat": "cognitivo", "cl": "geral"},{"id": "cog-estrategia-de-loop-autonomo-planejar-executar-verificar-corr", "label": "Estrategia de loop autonomo: planejar-executar-verificar-corrigir", "color": "#59a14f", "size": 11, "title": "Dominio: system_design\n\nQualquer sistema autonomo segue um ciclo fechado: (1) Planejar: decompor objetivo em passos verificaveis. (2) Executar: rodar cada passo com ferramentas reais. (3) Verificar: validar saida contra criterios objetivos (git diff, test pass, compilacao). (4) Corrigir: se falhou, registrar causa, replanejar, tentar de novo. O loop termina apenas quando TODOS os criterios de sucesso sao atingidos. Nao use max_iterations como criterio de parada — use deteccao de estagnacao (nenhum progresso em N iteracoes).", "cat": "cognitivo", "cl": "geral"},{"id": "cog-modelo-de-scoring-para-busca-multi-resultado", "label": "Modelo de scoring para busca multi-resultado", "color": "#59a14f", "size": 10, "title": "Dominio: algorithm\n\nQuando uma busca retorna multiplos resultados, nao aceite o primeiro. Atribua scores: match exato + peso alto, match parcial + peso medio, overlap lexical + peso baixo. Defina thresholds por modo (estrito vs relaxado). Acompanhe o melhor score entre TODOS os resultados, nao apenas o primeiro. Retorne null se nenhum resultado atingir o threshold minimo — e melhor falhar que retornar informacao errada. O usuario pode entao tentar modo relaxado.", "cat": "cognitivo", "cl": "geral"},{"id": "cog-diagnostico-por-eliminacao-em-config-complexa", "label": "Diagnostico por eliminacao em config complexa", "color": "#59a14f", "size": 14, "title": "Dominio: debugging\n\nQuando config tem multiplos componentes (provedores, servidores, MCP), isolar cada camada: testar provider isolado -> testar servidor -> testar MCP handshake -> testar chain completo", "cat": "cognitivo", "cl": "geral"},{"id": "cog-pattern-matching-por-estrutura-de-ui", "label": "Pattern matching por estrutura de UI", "color": "#59a14f", "size": 10, "title": "Dominio: ui-recognition\n\nToda interface segue padroes reconheciveis: modais tem header+body+footer, tabelas tem thead+tbody, listas sao scrollaveis com items repetidos, formularios tem labels+inputs. Reconhecer o padrao estrutural e mais rapido que ler cada elemento individualmente\n\nDigitalizar a tela em zonas: topo = header/nav, esquerda = sidebar/menu, centro = conteudo principal, direita = paineis auxiliares, fundo = modais/overlays. Saber onde procurar cada tipo de elemento reduz tempo de busca em 60%", "cat": "cognitivo", "cl": "geral"},{"id": "cog-modelo-mental-de-dom-virtual", "label": "Modelo mental de DOM virtual", "color": "#59a14f", "size": 10, "title": "Dominio: web-rendering\n\nSPAs (React/Vue/Angular) mantem DOM virtual que difere do DOM real. Mudancas de estado nao sao imediatamente visiveis no DOM real. Esperar pelo menos 1 ciclo de renderizacao (requestAnimationFrame ~16ms) apos cada acao antes de consultar o DOM", "cat": "cognitivo", "cl": "geral"},{"id": "cog-reconhecimento-de-estado-por-elementos-chave", "label": "Reconhecimento de estado por elementos-chave", "color": "#59a14f", "size": 10, "title": "Dominio: state-detection\n\nCada estado da UI tem elementos-charada: loading tem spinner, empty state tem 'Nenhum resultado', erro tem mensagem vermelha, sucesso tem toast verde. Identificar o estado pelo elemento unico e mais rapido que validar condicoes complexas", "cat": "cognitivo", "cl": "geral"},{"id": "cog-pre-compilacao-de-estrategia-de-interacao", "label": "Pre-compilacao de estrategia de interacao", "color": "#59a14f", "size": 10, "title": "Dominio: planning\n\nAntes de agir, mentalmente compilar toda a sequencia de passos: (1) onde estou, (2) onde quero chegar, (3) quais elementos preciso atravessar, (4) quais barreiras possiveis (modais, permissoes). Agir sem plano causa 3x mais erros", "cat": "cognitivo", "cl": "geral"},{"id": "cog-reconhecimento-instantaneo-de-framework", "label": "Reconhecimento instantaneo de framework", "color": "#59a14f", "size": 10, "title": "Dominio: framework-detection\n\nIdentificar o framework da interface em <500ms: React tem #root vazio, Vue tem #app, Angular tem <app-root>, jQuery tem muitos elementos com IDs, Bootstrap tem classes container/row/col, Material UI tem Mui-* classes. Framework define o comportamento da navegacao", "cat": "cognitivo", "cl": "geral"},{"id": "cog-ciclo-ooda-aplicado-a-navegacao", "label": "Ciclo OODA aplicado a navegacao", "color": "#59a14f", "size": 10, "title": "Dominio: decision-making\n\nObserve (scan estado atual) -> Orient (identifique padroes e framework) -> Decide (escolha metodo de interacao) -> Act (execute). Ciclo completo leva <1s para interfaces familiares, <3s para desconhecidas. Repetir apos cada interacao", "cat": "cognitivo", "cl": "geral"},{"id": "cog-heuristica-de-densidade-de-informacao", "label": "Heuristica de densidade de informacao", "color": "#59a14f", "size": 11, "title": "Dominio: efficiency\n\nQuanto mais texto/icones em uma tela, mais provavel que o elemento desejado esta em um sub-grupo (modal, accordion, tab). Telas densas quase sempre tem informacao escondida em componentes colapsaveis. Procurar botoes 'Expandir', 'Ver mais', 'Mostrar detalhes'", "cat": "cognitivo", "cl": "geral"},{"id": "cog-antecipacao-de-comportamento-adaptativo", "label": "Antecipacao de comportamento adaptativo", "color": "#59a14f", "size": 10, "title": "Dominio: adaptability\n\nInterfaces modernas sao adaptativas: mudam layout em resize, escondem elementos em mobile, alteram labels por A/B testing. Nunca assumir que um elemento estara no mesmo lugar da ultima vez. Sempre re-scannear o estado atual antes de interagir", "cat": "cognitivo", "cl": "geral"},{"id": "cog-mapa-mental-de-navegadores-web", "label": "Mapa mental de navegadores web", "color": "#59a14f", "size": 10, "title": "Dominio: browser-architecture\n\nNavegadores modernos sao multi-processo: processo browser (UI), processo renderer (DOM/JS), processo GPU (composicao). Cada processo e isolado. Crash no renderer nao derruba o browser. Cada aba tem seu proprio processo renderer. DevTools roda no processo browser", "cat": "cognitivo", "cl": "geral"},{"id": "cog-espera-adaptativa-por-tipo-de-recurso", "label": "Espera adaptativa por tipo de recurso", "color": "#59a14f", "size": 10, "title": "Dominio: performance\n\nTempos de carregamento variam por tipo: HTML inicial (rede), CSS (bloqueante ate parsed), JS (bloqueante ate executed), imagens (nao bloqueantes), fontes (FOUT/FOIT), API calls (variavel). Navegacao so esta completa quando HTML+CSS+JS processaram. Imagens podem continuar carregando", "cat": "cognitivo", "cl": "geral"},{"id": "cog-2026-07-27-setup-plug-play-e-organizacao-github", "label": "﻿# 2026-07-27 - Setup Plug & Play e organizacao GitHub", "color": "#59a14f", "size": 10, "title": "Dominio: general\n\n﻿# 2026-07-27 - Setup Plug & Play e organizacao GitHub\n\n## O que foi feito\n- Repositorios do GitHub mapeados: 11 existentes, nenhum LER separado\n- setup.bat criado: script unico para qualquer PC novo (clona, instala, configura, pede API keys)\n- config/opencode.jsonc: template com {{USERPROFILE}} placeholder para geracao dinamica\n- config/agents/: fonte unica dos 15 agentes OpenCode (repo eh source of truth)\n- config/opencode-model-fallback.jsonc: config do plugin fallback\n- Vigilante atualizado:\n\n﻿# 2026-07-27 - Unificacao compl roativo: Biblia\n## Marcadores encontrados\n- parse_apocrypha.py: 1 marcadores\n- parse_apocrypha2.py: 1 marcadores\n- parse_apocrypha3.py: 1 marcadores\n- ResourcesActivity.java: 3 marcadores\n\n\n\n﻿# 2026-07-29 - Scan proativo: CellCleaner\n## Marcadores encontrados\n- MainActivity.java: 1 marcadores\n\n\n\n﻿# 2026-07-29 - Scan proativo: Mp3Player\n## Marcadores encontrados\n- BiquadFilter.kt: 1 marcadores\n- EqualizerAudioProcessor.kt: 2 marcadores\n- AudioDecoder.kt: 1 marcadores\n- EqPresetManager.kt: 2 marcadores\n- MainActivity.kt: 2 marcadores\n- TagEditorActivity.kt: 1 marcadores\n\n\n\n﻿# 2026-07-29 - Scan proativo: SupermarketCalculator\n## Marcadores encontrados\n- MainActivity.java: 4 marcadores\n\n\n\n# 2026-07-29 — Integração de clima via OpenWeatherMap\n\n## Habilidade adicionada ao Jarvis\n- Nova skill: `skills/clima-api/skill.md`\n- Script: `scripts/clima_api.py`\n- Dicionário de pronúncia atualizado com termos climáticos (20 palavras)\n\n## Como funciona\n- Jarvis usa `python clima_api.py \"<cidade>\"` para obter clima em tempo real\n- Dados: descrição, temperatura, sensação térmica, umidade\n- Idioma: português brasileiro, unidades métricas\n- Chave da API deve estar em `scripts/.env` como `OPENWEAT\n\n﻿# 2026-07-30 - Scan proativo: Biblia\n## Marcadores encontrados\n- parse_apocrypha.py: 1 marcadores\n- parse_apocrypha2.py: 1 marcadores\n- parse_apocrypha3.py: 1 marcadores\n- ResourcesActivity.java: 3 marcadores\n\n\n\n﻿# 2026-07-30 - Scan proativo: CellCleaner\n## Marcadores encontrados\n- MainActivity.java: 1 marcadores\n\n\n\n﻿# 2026-07-30 - Scan proativo: Mp3Player\n## Marcadores encontrados\n- BiquadFilter.kt: 1 marcadores\n- EqualizerAudioProcessor.kt: 2 marcadores\n- AudioDecoder.kt: 1 marcadores\n- EqPresetManager.kt: 2 marcadores\n- MainActivity.kt: 2 marcadores\n- TagEditorActivity.kt: 1 marcadores\n\n\n\n﻿# 2026-07-30 - Scan proativo: SupermarketCalculator\n## Marcadores encontrados\n- MainActivity.java: 4 marcadores\n\n", "cat": "cognitivo", "cl": "geral"},{"id": "cog-2026-07-27-correcao-dos-4-pontos-finais-do-ecossistema", "label": "﻿# 2026-07-27 - Correcao dos 4 pontos finais do ecossistema", "color": "#59a14f", "size": 10, "title": "Dominio: general\n\n﻿# 2026-07-27 - Correcao dos 4 pontos finais do ecossistema\n\n## Problemas resolvidos\n1. **Paths fixos**: vigilante.ps1, ecosystem.ps1, SKILL.md agora usam env:USERPROFILE\n2. **LER vs OpenCode**: documentado que LER tem engine MODULES (Python), OpenCode tem AGENTES (LLM). Sao complementares, nao duplicados.\n3. **ecosystem learn**: varredura proativa que escaneia projetos Android + registra no knowledge graph\n4. **Vigilante aprende sozinho**: timer diario executa ecosystem learn automaticamente\n5.", "cat": "cognitivo", "cl": "geral"},{"id": "cog-encoding-aware-diagnostics", "label": "Encoding-aware diagnostics", "color": "#59a14f", "size": 14, "title": "Dominio: debugging\n\nAo diagnosticar arquivos JSON no Windows, sempre especificar encoding=utf-8. O default cp1252 pode mascarar arquivos perfeitamente validos como corrompidos.", "cat": "cognitivo", "cl": "geral"},{"id": "cog-entender-antes-de-criar-ontologia-de-habilidades", "label": "Entender antes de criar: ontologia de habilidades", "color": "#59a14f", "size": 10, "title": "Dominio: metacognicao\n\nAntes de catalogar habilidades, estude a taxonomia existente. O que parece habilidade pode ser ferramenta, conhecimento ou skill.", "cat": "cognitivo", "cl": "geral"},{"id": "cog-gramática-do-português-brasileiro-guia-prático-do-dia-a-dia", "label": "Gramática do Português Brasileiro — Guia prático do dia a dia", "color": "#59a14f", "size": 10, "title": "Dominio: general\n\n# Gramática do Português Brasileiro — Guia prático do dia a dia\n\n- **Data:** 01/08/2026\n- **Sessão:** Aprendizado permanente — gramática PT-BR para uso contínuo em comunicações\n\n## Propósito\nEste guia é o referencial de gramática do Português Brasileiro que todo agente deve\nusar no dia a dia: TTS, transcrições, textos, documentação e conversas. Focado no\nuso prático, sem jargão acadêmico desnecessário.\n\n## Ortografia e acentuação\n- Acentuação segue o novo acordo ortográfico (em vigor no Brasil d", "cat": "cognitivo", "cl": "geral"},{"id": "cog-habilidade-navegação-perita-internet-pc-e-celular", "label": "Habilidade: Navegação Perita — Internet, PC e Celular", "color": "#59a14f", "size": 10, "title": "Dominio: general\n\n# Habilidade: Navegação Perita — Internet, PC e Celular\n\n- **Data:** 01/08/2026\n- **Sessão:** Criação da habilidade de navegação perita com pesquisa de ferramentas no GitHub\n\n## Resumo\nCriada a habilidade `navegacao-perita` no catálogo do ecossistema (Habilidades/tecnicas/navegacao-perita/skill.md),\nregistrada no `manifesto_geral.json`, cobrindo as três frentes: navegador (internet), programas do PC (Windows)\ne aplicativos de celular (Android). Baseada em pesquisa do estado da arte de ferramenta\n\n# Jarvis do celular e do PC: um só cérebro (arquitetura sincronizada)\n\n- **Data:** 01/08/2026\n- **Sessão:** Verificação da sincronização entre o app Android e o opencode no PC\n\n## Conclusão\n**Não existem dois Járvis diferentes.** O app do celular (VoxUmGrau) não tem\ninteligência própria — é um cliente de voz que conversa com o MESMO `opencode serve`\nque roda no PC. Quando o usuário fala com o celular, quem responde é o mesmo\nassistente que opera no computador.\n\n## Como a sincronização acontece (", "cat": "cognitivo", "cl": "geral"},{"id": "cog-pronúncia-járvis-escrita-sem-acento-fala-com-acento", "label": "Pronúncia \"Járvis\" (escrita sem acento, fala com acento)", "color": "#59a14f", "size": 10, "title": "Dominio: general\n\n# Pronúncia \"Járvis\" (escrita sem acento, fala com acento)\n\n- **Data:** 01/08/2026\n- **Sessão:** Pedido direto do usuário sobre pronúncia do nome do assistente\n\n## Regra permanente\n- **Escrita:** sempre \"Jarvis\", **sem acento**.\n- **Pronúncia (fala/TTS):** \"Járvis\" — acento tônico no primeiro A (JA-rvis, fonético: /ˈʒaʁ.vis/).\n- Nunca pronunciar \"Jár-vis\" com o segundo A fechado nem com acento na última sílaba (\"Jarvís\").\n\n## Implementação\n- Registrado em `scripts/pronuncias.json`:\n  `\"jarvis\": ", "cat": "cognitivo", "cl": "geral"},{"id": "h-regra-dos-3-logs", "label": "Regra dos 3 logs", "color": "#76b7b2", "size": 14, "title": "Antes de comecar a debugar, adicione 3 logs: (1) entrada da funcao com parametros, (2) ponto medio/dentro do loop, (3) saida com resultado. Isso cobre 90% dos bugs sem precisar de debugger.", "cat": "heuristicas", "cl": "geral"},{"id": "h-heuristica-de-isolamento-de-falha", "label": "Heuristica de isolamento de falha", "color": "#76b7b2", "size": 14, "title": "Quando um sistema falha, isole variaveis UMA de cada vez. Mude exatamente uma coisa entre cada teste. Se voce mudar duas coisas e o bug desaparecer, voce nao sabe qual das duas resolveu.", "cat": "heuristicas", "cl": "geral"},{"id": "h-escrita-atomica-sempre", "label": "Escrita atomica sempre", "color": "#76b7b2", "size": 10, "title": "Qualquer escrita em arquivo que importa: tmp + rename atomico. Nao importa o quao trivial parece. Um crash no meio do json.dump corrompe o arquivo e voce perde tudo.", "cat": "heuristicas", "cl": "geral"},{"id": "h-principio-do-menor-escopo-de-variavel", "label": "Principio do menor escopo de variavel", "color": "#76b7b2", "size": 10, "title": "Declare variaveis no menor escopo possivel. Se uma variavel pode ser local a um if, nao a declare no inicio da funcao. Isso reduz carga cognitiva e previne bugs de reuse de estado.", "cat": "heuristicas", "cl": "geral"},{"id": "h-interface-sobre-implementacao-em-parametros", "label": "Interface sobre implementacao em parametros", "color": "#76b7b2", "size": 10, "title": "Funcoes que aceitam dados devem aceitar o tipo MAIS GENERICO possivel (File, nao um path especifico; List, nao ArrayList; InputStream, nao FileInputStream). Isso maximiza reuso e testabilidade.", "cat": "heuristicas", "cl": "geral"},{"id": "h-cache-de-decisoes-caras", "label": "Cache de decisoes caras", "color": "#76b7b2", "size": 11, "title": "Se uma computacao e deterministica e custosa, cacheie o resultado. Se o resultado pode mudar, invalide o cache explicitamente. Nunca confie em TTL para invalidação de dados que precisam ser consistentes.", "cat": "heuristicas", "cl": "geral"},{"id": "h-sempre-esperar-o-inesperado-em-es", "label": "Sempre esperar o inesperado em E/S", "color": "#76b7b2", "size": 11, "title": "Toda operacao de E/S (rede, disco, banco) pode falhar. Sempre tenha: timeout, retry com backoff, fallback, e log do erro. Nao existe excecao 'que nunca acontece' em E/S.", "cat": "heuristicas", "cl": "geral"},{"id": "h-regra-do-nao-magico", "label": "Regra do 'nao magico'", "color": "#76b7b2", "size": 10, "title": "Numeros magicos, strings literais repetidas, e comportamento implicito sao bugs esperando para acontecer. Extraia para constantes nomeadas com documentacao do porque daquele valor.", "cat": "heuristicas", "cl": "geral"},{"id": "h-state-deve-ser-explícito-nunca-implícito", "label": "State deve ser explícito, nunca implícito", "color": "#76b7b2", "size": 10, "title": "Se um componente tem estado (ativo/inativo, conectado/desconectado, editando/visualizando), represente-o como UMA variavel booleana ou enum, nao como combinacao de multiplos sinais. State implicito (ex: 'se alpha=0 e visibility=GONE entao ta oculto') e fonte de bugs.", "cat": "heuristicas", "cl": "geral"},{"id": "h-dados-algoritmos-para-debugging", "label": "Dados > Algoritmos para debugging", "color": "#76b7b2", "size": 14, "title": "Quando um algoritmo parece errado, nao olhe primeiro para o algoritmo. Imprima/inspecione os DADOS que ele esta processando. 90% das vezes o algoritmo esta certo e os dados estao errados (formato inesperado, null onde nao deveria, encoding errado, valores fora de range).", "cat": "heuristicas", "cl": "geral"},{"id": "h-verifique-o-que-voce-acha-que-sabe", "label": "Verifique o que voce acha que sabe", "color": "#76b7b2", "size": 14, "title": "Toda vez que pensar 'isso nao pode ser a causa porque ja sei como funciona', VERIFIQUE. As suposicoes mais obvias sao as que mais escondem bugs. Um 'confia mas verifica' sistematico elimina horas de debugging.", "cat": "heuristicas", "cl": "geral"},{"id": "h-projete-para-falha-nao-para-sucesso", "label": "Projete para falha, nao para sucesso", "color": "#76b7b2", "size": 10, "title": "Um sistema robusto nao e o que nunca falha — e o que lida graciosamente com cada falha. Pergunte: 'O que acontece se o disco enche? E se a rede cai? E se a memoria acaba? E se o arquivo esta corrompido?' Para cada resposta, implemente um comportamento previsivel.", "cat": "heuristicas", "cl": "geral"},{"id": "h-sempre-validar-schema-apos-migracao-de-config", "label": "Sempre validar schema apos migracao de config", "color": "#76b7b2", "size": 10, "title": "Ferramentas que geram config podem produzir schema invalido; sempre ler spec e validar manualmente apos edicao", "cat": "heuristicas", "cl": "geral"},{"id": "h-nunca-armazenar-api-keys-em-config-files", "label": "Nunca armazenar API keys em config files", "color": "#76b7b2", "size": 10, "title": "Auth tokens e chaves API devem ficar em env vars ou auth.json criptografado, nunca em opencode.json", "cat": "heuristicas", "cl": "geral"},{"id": "h-testar-failover-ativamente", "label": "Testar failover ativamente", "color": "#76b7b2", "size": 10, "title": "Nao confiar em logica de fallback sem testar: derrubar servico primario e verificar se secundario assume", "cat": "heuristicas", "cl": "geral"},{"id": "h-elemento-existe-3-fontes-de-verdade", "label": "Elemento existe? 3 fontes de verdade", "color": "#76b7b2", "size": 14, "title": "Sempre cruzar 3 fontes antes de afirmar que elemento nao existe: (1) DOM/arvore atual, (2) screenshot com OCR, (3) viewport/scroll position. Se 2 de 3 concordam, elemento existe", "cat": "heuristicas", "cl": "geral"},{"id": "h-navegacao-em-spa-3-sinais-de-sucesso", "label": "Navegacao em SPA: 3 sinais de sucesso", "color": "#76b7b2", "size": 10, "title": "SPA navegou corretamente se 2 de 3 mudarem: (1) URL (pushState), (2) title da pagina, (3) conteudo do container principal (#root, #app). Verificar os 3 apos cada clique", "cat": "heuristicas", "cl": "geral"},{"id": "h-antes-de-clicar-verifique-o-interceptador", "label": "Antes de clicar, verifique o interceptador", "color": "#76b7b2", "size": 10, "title": "Sempre verificar (1) modal aberto, (2) notificacao, (3) teclado virtual, (4) overlay de loading antes de clicar em qualquer elemento. Cada um desses causa falha misteriosa.", "cat": "heuristicas", "cl": "geral"},{"id": "h-hierarquia-de-confianca-de-seletores", "label": "Hierarquia de confianca de seletores", "color": "#76b7b2", "size": 10, "title": "Web: data-testid > #id > [name] > .class-unica > tag[attr] > :contains. Desktop: AutomationId > Name > ClassName > coordenadas. Mobile: resource-id > content-desc > text > coordenadas relativas", "cat": "heuristicas", "cl": "geral"},{"id": "h-stale-element-re-query-nao-re-tentar", "label": "Stale element = re-query, nao re-tentar", "color": "#76b7b2", "size": 14, "title": "Elemento stale significa que a referencia morreu; re-tentar a mesma operacao no mesmo objeto nunca funciona. Re-buscar o elemento pelo seletor original e a unica solucao", "cat": "heuristicas", "cl": "geral"},{"id": "h-scroll-forcado-revela-conteudo-oculto", "label": "Scroll forcado revela conteudo oculto", "color": "#76b7b2", "size": 10, "title": "Conteudo lazy-loaded so aparece quando usuario faz scroll. Scroll ate o fim, espera 1s, scroll de novo, repete 3x. Metade dos 'elementos nao encontrados' sao lazy-loaded", "cat": "heuristicas", "cl": "geral"},{"id": "h-velocidade-evitar-esperas-fixas", "label": "Velocidade = evitar esperas fixas", "color": "#76b7b2", "size": 11, "title": "Esperar 10s 'para garantir' custa 10s por operacao. Usar waitForElement com polling a cada 100ms e timeout de 10s: se elemento aparece em 200ms, voce ganhou 9.8s", "cat": "heuristicas", "cl": "geral"},{"id": "h-teclado-vence-layout", "label": "Teclado vence layout", "color": "#76b7b2", "size": 10, "title": "Quando mouse/clique falha, Tab+Enter resolve em 80% dos casos. Atalhos de teclado sao independentes de CSS, tema, idioma, e resolucao. Sempre tenha fallback por teclado", "cat": "heuristicas", "cl": "geral"},{"id": "h-primeiro-scan-depois-interaja", "label": "Primeiro scan, depois interaja", "color": "#76b7b2", "size": 11, "title": "Antes de qualquer acao, faca um scan completo do estado atual: elementos visiveis, modais, estado de loading. Agir cegamente leva a 3x mais retries. 1 scan evita 3 falhas", "cat": "heuristicas", "cl": "geral"},{"id": "h-seletor-mais-especifico-mais-fragil", "label": "Seletor mais especifico = mais fragil", "color": "#76b7b2", "size": 10, "title": "data-testid=product-123 e exato mas quebra se o ID mudar. Preferir seletores semanticos: [data-testid^=product-] ou .product-card capturam variacoes sem quebrar", "cat": "heuristicas", "cl": "geral"},{"id": "h-canvas-e-graficos-template-matching", "label": "Canvas e graficos: template matching", "color": "#76b7b2", "size": 10, "title": "Elementos renderizados em canvas, SVG complexo ou WebGL nao tem arvore DOM utilizavel. Screenshot + template matching (OpenCV) + OCR e o unico caminho confiavel", "cat": "heuristicas", "cl": "geral"},{"id": "h-30s-regra-de-timeout-maximo", "label": "30s regra de timeout maximo", "color": "#76b7b2", "size": 11, "title": "Nenhuma operacao de navegacao deve esperar mais que 30s. Se algo demora mais que isso, algo esta quebrado (rede, servidor, loop infinito). Fail fast, nao espere", "cat": "heuristicas", "cl": "geral"},{"id": "h-log-de-fallback-para-diagnostico-rapido", "label": "Log de fallback para diagnostico rapido", "color": "#76b7b2", "size": 14, "title": "Sempre logar: (1) o que tentou fazer, (2) qual seletor usou, (3) o que encontrou, (4) o que deu errado. Logs estruturados reduzem tempo de debugging em 5x", "cat": "heuristicas", "cl": "geral"},{"id": "h-json-rpc-notifications", "label": "JSON-RPC notifications", "color": "#76b7b2", "size": 10, "title": "Sempre verificar se request tem id antes de responder. Se nao tem, e notification - nao responda.", "cat": "heuristicas", "cl": "geral"},{"id": "h-mcp-tool-naming", "label": "MCP tool naming", "color": "#76b7b2", "size": 10, "title": "MCP tools/list pode expor nomes kebab-case, mas tools/call precisa de mapping explicito para metodos internos", "cat": "heuristicas", "cl": "geral"},{"id": "h-workspace-root", "label": "Workspace root", "color": "#76b7b2", "size": 10, "title": "Manter projetos em raiz unica sem espacos no caminho para compatibilidade com scripts", "cat": "heuristicas", "cl": "geral"},{"id": "h-open-sempre-com-encoding-no-windows", "label": "open() sempre com encoding no Windows", "color": "#76b7b2", "size": 14, "title": "Todo open() de arquivo texto deve especificar encoding. No Windows, o default muda conforme o locale do sistema.", "cat": "heuristicas", "cl": "geral"},{"id": "fw-ciclo-pdca-plan-do-check-act-para-engenharia", "label": "Ciclo PDCA (Plan-Do-Check-Act) para engenharia", "color": "#edc948", "size": 10, "title": "Loop classico de melhoria continua adaptado para engenharia de software.", "cat": "frameworks", "cl": "cognicao"},{"id": "fw-metodo-dos-5-porques-5-whys", "label": "Metodo dos 5 Porques (5 Whys)", "color": "#edc948", "size": 10, "title": "Tecnica de analise de causa raiz: pergunte 'por que?' 5 vezes para cada sintoma.", "cat": "frameworks", "cl": "cognicao"},{"id": "fw-mece-mutually-exclusive-collectively-exhaustive", "label": "MECE (Mutually Exclusive, Collectively Exhaustive)", "color": "#edc948", "size": 10, "title": "Principio de classificacao: particoes sem sobreposicao que cobrem todo o espaco.", "cat": "frameworks", "cl": "cognicao"},{"id": "fw-first-principles-para-testes", "label": "FIRST Principles para testes", "color": "#edc948", "size": 10, "title": "Propriedades de um bom teste unitario: Fast, Isolated, Repeatable, Self-validating, Timely.", "cat": "frameworks", "cl": "cognicao"},{"id": "fw-arvore-de-decisao-para-fallback-de-servico", "label": "Arvore de Decisao para Fallback de Servico", "color": "#edc948", "size": 10, "title": "Estrategia para servicos com multiplas fontes de dados em ordem de preferencia.", "cat": "frameworks", "cl": "cognicao"},{"id": "fw-framework-de-persistencia-com-snapshot-imutavel", "label": "Framework de Persistencia com Snapshot Imutavel", "color": "#edc948", "size": 10, "title": "Padrao onde cada salvamento e um snapshot timestampado, nunca overwrite.", "cat": "frameworks", "cl": "cognicao"},{"id": "fw-framework-de-aprendizado-continuo-auto-learning", "label": "Framework de Aprendizado Continuo (Auto-Learning)", "color": "#edc948", "size": 10, "title": "Sistema que acumula conhecimento automaticamente entre sessoes.", "cat": "frameworks", "cl": "cognicao"},{"id": "fw-cascata-de-interacao-ci", "label": "Cascata de Interacao (CI)", "color": "#edc948", "size": 10, "title": "Framework de 4 niveis para interagir com qualquer elemento: N1 = seletor direto (data-testid/resource-id), N2 = seletor semantico (classe/tag/texto), N3 = coordenadas relativas, N4 = OCR + template matching. Subir um nivel a cada 3 falhas consecutivas", "cat": "frameworks", "cl": "navegacao"},{"id": "fw-ooda-nav", "label": "OODA-Nav", "color": "#edc948", "size": 10, "title": "Adaptacao do ciclo Observe-Orient-Decide-Act de Boyd para navegacao automatizada. Ciclo completo <3s. Repetir a cada interacao", "cat": "frameworks", "cl": "navegacao"},{"id": "fw-3-scan-pre-action", "label": "3-Scan Pre-Action", "color": "#edc948", "size": 10, "title": "Protocolo de 3 scans antes de cada acao para garantir contexto completo e evitar falhas evitaveis", "cat": "frameworks", "cl": "navegacao"},{"id": "hub-android", "label": "★ Android", "color": "#8dd3c7", "size": 30, "title": "Hub do cluster android — 7 999", "width": 1}]);
  const container = document.getElementById('net');
  const options = {
    nodes: { shape:'dot', font:{ size:11, color:'#cdd6f4' } },
    edges: { smooth:{ type:'continuous' } },
    physics: { barnesHut: { gravitationalConstant:-3000, springLength:120, springConstant:0.04, damping:0.09 },
               stabilization: { iterations:300 } },
    interaction: { hover:true, tooltipDelay:120, navigationButtons:true }
  };
  const network = new vis.Network(container, { nodes, edges }, options);

  const original = {};
  nodes.get().forEach(n => {
    original[n.id] = { color: n.color, size: n.size };
  });

  function destacar(filtro, valor) {
    const btns = document.querySelectorAll('.lg');
    btns.forEach(b => b.classList.remove('active'));
    const alvo = document.querySelector(`.lg[data-filter="${filtro}"][data-value="${valor}"]`);
    if (alvo) alvo.classList.add('active');

    const atualizacoes = [];
    nodes.get().forEach(n => {
      let ativo = false;
      if (filtro === 'all') ativo = true;
      else if (filtro === 'cat') ativo = (n.cat === valor);
      else if (filtro === 'cl') ativo = (n.cl === valor);
      if (ativo) {
        atualizacoes.push({ id: n.id, color: original[n.id].color, size: original[n.id].size,
                            borderWidth: 2, borderWidthSelected: 2 });
      } else {
        atualizacoes.push({ id: n.id, color: '#2a2a3c', size: 3, opacity: 0.15,
                            borderWidth: 0, borderWidthSelected: 0 });
      }
    });
    nodes.update(atualizacoes);
    network.fit({ animation: true });
  }

  document.querySelectorAll('.lg').forEach(btn => {
    btn.addEventListener('click', () => destacar(btn.dataset.filter, btn.dataset.value));
  });
