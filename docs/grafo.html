  #legend { display:flex; gap:6px; flex-wrap:wrap; font-size:11px; }

  #net { flex:1; height:calc(100vh - 100px); }
  #painel { display:none; width:320px; margin:10px 12px 10px 0; background:#181825; border:1px solid #313244;
            border-radius:8px; padding:12px; overflow-y:auto; max-height:calc(100vh - 120px); }
  #painel.visivel { display:block; }
  #painel h2 { font-size:13px; margin:0 0 10px; display:flex; align-items:center; gap:6px; }
  #painel .count { font-size:10px; color:#a6adc8; font-weight:normal; }
  #painel ul { list-style:none; margin:0; padding:0; }
  #painel li { padding:7px 8px; border-bottom:1px solid #232335; font-size:11px; cursor:pointer; }
  #painel li:hover { background:#232335; }
  #painel li.sel { background:#313244; border-left:3px solid #89b4fa; }
  .titulo-sel { color:#ffffff; }
  #painel .titulo { color:#cdd6f4; font-weight:600; }
  #painel .spec { color:#a6adc8; margin-top:2px; max-height:2.4em; overflow:hidden; display:-webkit-box;
                  -webkit-line-clamp:2; -webkit-box-orient:vertical; }

  /* Tooltip do vis-network: organizado, legivel e responsivo */
  .vis-tooltip {
    position: absolute;
    max-width: min(420px, 85vw);
    max-height: 70vh;
    overflow-y: auto;
    background: rgba(24,24,37,0.96);
    border: 1px solid #45475a;
    border-radius: 8px;
    padding: 10px 12px;
    color: #cdd6f4;
    font-size: 12px;
    line-height: 1.45;
    white-space: pre-line;
    box-shadow: 0 4px 18px rgba(0,0,0,0.6);
    z-index: 10000;
  }
  /* Tooltip dos botoes da legenda: estilo nativo (title) ja e suficiente;
     este bloco apenas garante que a legenda nao estoure em telas pequenas. */
  @media (max-width: 720px) {
    #header { padding:8px 10px; }
    #legend { gap:4px; font-size:10px; }
    .lg { padding:2px 6px; font-size:10px; }
    #net { height:calc(100vh - 80px); }
    #painel { width:260px; }
  }
  /* Tooltip nativo (title) dos botoes: garante quebre de linha adequada */
  .lg[title]:hover {
    position: relative;
    z-index: 9998;
  }

  /* Labels responsivas com transicao suave */
  .vis-network .vis-node shape > text,
  .vis-network .vis-label {
    transition: opacity 0.35s ease-out, font-size 0.35s ease-out, fill 0.35s ease-out !important;
  }
  /* Flash de sinapse */
  .vis-node.flash {
    animation: flashPulse 0.8s ease-out;
  }
  @keyframes flashPulse {
    0%   { filter: drop-shadow(0 0 4px #fff) drop-shadow(0 0 8px #fff) drop-shadow(0 0 16px #fff); }
    50%  { filter: drop-shadow(0 0 8px #fff) drop-shadow(0 0 16px #fff) drop-shadow(0 0 32px #fff); }
    100% { filter: drop-shadow(0 0 4px #fff) drop-shadow(0 0 8px #fff) drop-shadow(0 0 16px #fff); }
  }

  function _ajustarFontes() {

  }

  // abre os clusters revelando os nos internos (efeito "expandir").
  function _fazerClusteres() {
    if (nodes.get().length <= 80) return; // so para grafos com volume
    var grau = {};
    edges.get().forEach(function(e) {
      grau[e.from] = (grau[e.from] || 0) + 1;
      grau[e.to] = (grau[e.to] || 0) + 1;

      return !n.isHidden && (grau[n.id] || 0) <= 1;

    var agrupados = {};
    var usados = new Set();
    for (var i = 0; i < folhas.length; i++) {

      if (usados.has(f.id)) continue;

      var grupo = [f.id]; usados.add(f.id);

        .filter(function(e) { return e.from === f.id || e.to === f.id; })
        .slice(0, 7);
      adjacentes.forEach(function(e) {
        var o = e.from === f.id ? e.to : e.from;
        if (!usados.has(o) && grupo.length < 8) { grupo.push(o); usados.add(o); }
      });
      try {
        network.cluster({
          joinCondition: function(n) { return grupo.indexOf(n.id) !== -1; },
          edgesBetween: true,
          clusterNode: { shape: 'box', label: grupo.length.toString(),
            font: { size: 10, color: '#89b4fa' },
            color: { background: 'rgba(137,180,250,0.18)' },
            borderWidth: 1, size: Math.max(8, Math.min(24, grupo.length))

    if (!lst.length) return;

  // Alem da profundidade (pseudo-3D), os nos ganham uma DERIVA ORBITAL suave:
  // cada no orbita o centro do quadro numa elipse lenta, com raio, excentricidade
  // e velocidade proprios (estaveis por id). A superposicao de orbitas quase
  // periodicas produz o "agito" organico de um grafo force-directed vivo — as
  // posicoes parecem flutuar, e arrastar um no puxa a orbita ao redor.
  // As forcas do vis-network (barnesHut) continuam dominando; a deriva e uma
  // pertubacao pequena (amplitude ~4-9px) para nao desmanchar a estrutura.
  var _orbAmplGlobal = 1; // multiplicador de amplitude da deriva (persistido)

      ay: 3 + ((h >> 3) % 29) / 29 * 5,   // semi-eixo Y  (3..8)
      sp: 0.12 + ((h >> 5) % 53) / 53 * 0.22,  // velocidade angular
      ph: (h % 628) / 100,                // fase inicial
      ex: 0.25 + ((h >> 2) % 11) / 11 * 0.5,   // excentricidade 0.25..0.75
      inc: ((h >> 7) % 360) * Math.PI / 180,   // inclinacao da elipse
    };
  });
  function _derivaOrbital(id, t) {
    const o = _orb[id];
    if (!o) return { dx: 0, dy: 0 };
    const ang = t * 0.001 * o.sp * _velGlobal + o.ph;
    // elipse: x = a*cos, y = b*sin (com excentricidade no eixo x)
    const cx = Math.cos(o.inc), sy = Math.sin(o.inc);
    let ex = o.ax * Math.cos(ang), ey = o.ay * Math.sin(ang) * o.ex;
    // rotaciona a elipse pela inclinacao propria do no
    return { dx: (ex * cx - ey * sy) * _orbAmplGlobal,

  }
  // Expoe controle de amplitude orbital para o painel do widget persistir
  function _aplicarOrbita(fator) {
    fator = Number(fator) || 1;
    _orbAmplGlobal = Math.max(0, Math.min(3, fator));
  }

  // Expoe controle de intensidade da onda 3D para o painel do widget
  function _aplicarWaveIntensidade(fator) {
    fator = Number(fator) || 1;
    _waveIntensidade = Math.max(0, Math.min(3, fator));

  }

  // --- STATS VIVOS ----------------------------------------------------------
  // Atualiza o rodape (#stats) com contagens por cluster e por categoria em
  // tempo real (reflete filtros/ocultacao atual sem recarregar a pagina).
  var _clusterCorPorCl = {};
  nodes.get().forEach(n => { if (n.cl && !_clusterCorPorCl[n.cl]) {
    _clusterCorPorCl[n.cl] = original[n.id] ? original[n.id].color : '#888';
  } });
  function _atualizarStats() {
    try {
      const el = document.getElementById('stats');
      if (!el) return;
      const todos = nodes.get();
      const total = todos.length;
      const porCl = {};
      const porCat = {};
      todos.forEach(n => {
        const cl = n.cl || 'geral';
        porCl[cl] = (porCl[cl] || 0) + 1;
        porCat[n.cat || '?'] = (porCat[n.cat || '?'] || 0) + 1;
      });
      let txt = total + ' nos | ' + edges.get().length + ' conexoes';
      const cls = Object.keys(porCl).sort((a,b) => porCl[b]-porCl[a]);
      if (cls.length) {
        txt += ' • ' + cls.map(c => c + ':' + porCl[c]).join('  ');

  }

  setTimeout(_atualizarStats, 1200);

  var _sombraCor = 'rgba(137,180,250,0.35)';
  var _glowCor = '#89b4fa';
  var _pulsoForca = 1.0;
  var _pulsoSombra = 1.0;

  network.on('tick', () => {
    if (_tickPausado) return;
    // Quando ha um destaque/foco ativo (clicado em no, categoria, cluster),
    // congelamos a decoracao viva para NAO apagar o efeito visual escolhido.
    if (_destacado) return;
    const agora = Date.now();
    const base = 0.80 + 0.20 * Math.sin(agora * 0.0022);
    // --- pseudo-3D: calcula tamanho/opacidade/glow por profundidade viva ---
    // Perto (z->1): mais opaco, maior e mais brilhante. Longe (z->0):
    // translucido, menor e apagado -> efeito de relevo/esfera de conhecimento.
    const noUpd = [];
    // Posicao fisica VIVA (body), nao a do dataset: o dataset nao tem x/y
    // (layout nao armazena posicao), entao n.x/n.y podem ser undefined e
    // virariam NaN ao somar a deriva orbital -> quadtree recursao infinita.
    const _posAtual = network.getPositions();
    const agoraPulso = (!window.__pulseT || (agora - window.__pulseT) > 220);
    if (agoraPulso) window.__pulseT = agora;
    nodes.get().forEach(n => {
      const z = _zVivo(n.id, agora); // flutua autonomo no tempo
      const esc = 0.68 + 0.62 * z;   // fator de escala por profundidade
      const op = Math.min(1, base * (0.50 + 0.50 * z));
      let sz = (original[n.id] ? original[n.id].size : 12);
      let sombra = Math.round(14 + 18 * z);
      // deriva orbital: desloca o no suavemente em volta da posicao fisica
      const orb = _derivaOrbital(n.id, agora);
      if (agoraPulso) {
        const fase = _zFase[n.id] != null ? _zFase[n.id] : ((_hashId(n.id) || 0) % 97);
        // Nos QUENTES (atividade real alta, mtime recente) latejam com mais
        // energia e brilham mais forte: o pulso escala com atv.
        const atv = (n.atv != null) ? n.atv : 0.5;
        const pulso = Math.sin(agora * 0.0020 * _velGlobal + fase) * (0.07 + 0.13 * atv) * _pulsoForca;
        sz = Math.max(6, sz * (1 + pulso * 0.55) * esc);
        sombra = Math.round(sombra + (6 + 14 * atv) * pulso * _pulsoSombra);
      } else {
        sz = Math.max(6, sz * esc);
      }
      const _pb = _posAtual[n.id];
      const px = (_pb && Number.isFinite(_pb.x)) ? _pb.x : (Number.isFinite(n.x) ? n.x : 0);
      const py = (_pb && Number.isFinite(_pb.y)) ? _pb.y : (Number.isFinite(n.y) ? n.y : 0);
      noUpd.push({
        id: n.id,
        opacity: op,
        shadow: z > 0.3,
        shadowSize: sombra,
        size: sz,
        x: px + orb.dx,
        y: py + orb.dy

    });

    // --- arestas: opacidade pela profundidade media das pontas ---
    // Conexoes entre nos "perto" ficam mais visiveis; entre "longe" somem.
    let arestasUp = edges.get().map(e => {
      const zA = _zVivo(e.from, agora);
      const zB = _zVivo(e.to, agora);
      const zM = (zA + zB) / 2;
      return { id: e.id, color: arestaOriginal[e.id] ? arestaOriginal[e.id].color : '#999',

      _ultimoSpike = agora;
      const todas = edges.get();
      if (todas.length) {
        const alvos = [];
        const qtd = 2 + Math.floor(Math.random() * 4);
        for (let i = 0; i < qtd && todas.length; i++) {
          alvos.push(todas[Math.floor(Math.random() * todas.length)].id);
        }
arestasUp = arestasUp.map(a =>
            alvos.includes(a.id)
              ? { ...a, color: _glowCor, width: 5.5, opacity: 1 }
              : a);
        // leve glow no no destino de cada sinapse
        alvos.forEach(edgeId => {
          const _ed = todas.find(x => x.id === edgeId);
          if (!_ed) return;

  });

  network.on('blurNode', () => { _tickPausado = false; });

  // Intervalo aleatorio entre pulsos de sinapse (1.6s a 3.2s)
  function _proxSpike() { return 1600 + Math.random() * 1600; }

  // --- DISPARO NEURAL + AVALANCHE (criticalidade auto-organizada) ---
  // Atualiza os potenciais de membrana de todos os nos (corrente de base) e,

  var _sinapsePorNo = null; // cache {id: [vizinhos]}
  function _vizinhos(id) {

        (_sinapsePorNo[e.from] = _sinapsePorNo[e.from] || []).push(e.to);

    const noOrig = original[no.id];

        id: no.id,

      })(no.id, noOrig.color, noOrig.size);

    nodes.get().forEach(function(n) {

  (function() {

          const up = edges.get().map(a => {

            return a;
          });
          edges.update(up);
          if (original[ed.to]) nodes.update([{ id: ed.to, color: '#89b4fa', size: 26, shadow: true, shadowSize: 26 }]);
          setTimeout(() => {
            const rup = edges.get().map(a => {
              if (a.id === ed.id) return { id: a.id, color: arestaOriginal[a.id].color, width: arestaOriginal[a.id].width, opacity: 0.25 };
              return a;
            });
            edges.update(rup);
            if (original[ed.to]) nodes.update([{ id: ed.to, color: original[ed.to].color, size: original[ed.to].size }]);
          }, 550);
        }, i * 90);
      });
    }, 600);
  })();

  function clarear(hex, fator) {
    hex = hex.replace('#', '');
    const r = Math.min(255, Math.round(parseInt(hex.substring(0,2),16) * fator + 255 * (1 - fator)));
    const g = Math.min(255, Math.round(parseInt(hex.substring(2,4),16) * fator + 255 * (1 - fator)));
    const b = Math.min(255, Math.round(parseInt(hex.substring(4,6),16) * fator + 255 * (1 - fator)));
    return '#' + [r,g,b].map(x => x.toString(16).padStart(2,'0')).join('');
  }

  // --- Flash visual no clique do no ---
  // Pulsos de brilho branco/tema que se expandem e recolhem, com fade.
  var _flashAtivo = false;
  function flashNo(id, cor) {
    if (_flashAtivo) return;
    var orig = original[id];
    if (!orig) return;
    _flashAtivo = true;
    var c = cor || '#ffffff';
    nodes.update([{ id: id, color: c, size: Math.max(orig.size, 16) * 1.4, shadow: true, shadowSize: 42, shadowColor: c }]);
    setTimeout(function() {
      _flashAtivo = false;
      nodes.update([{ id: id, color: orig.color, size: orig.size, shadow: false, shadowSize: 0 }]);
    }, 750);
  }

  // --- Alternar modo 3D (onda viajante de profundidade) ---
  function _toggle3D(ativo) {
    _modo3D = ativo;
    if (typeof localStorage !== 'undefined') localStorage.setItem('modo3D', ativo);
    // Força update imediato: quando ativado/disativado, o tick loop precisa
    // recalculal a profundidade viva com a onda viajante.
    _tickPausado = false;
    // se desativado, restaura a z base de todos os nos
    if (!ativo) {
      nodes.get().forEach(function(n) {
        var z = _zBase[n.id] != null ? _zBase[n.id] : 0.5;
        var esc = 0.68 + 0.62 * z;
        var op = Math.min(1, 0.85 * (0.55 + 0.55 * z));
        nodes.update([{ id: n.id, size: Math.max(6, (original[n.id] ? original[n.id].size : 12) * esc), opacity: op }]);
      });
    }
  }

  // --- Alternar flash nos cliques ---
  function _toggleFlash(ativo) {
    _flashEnabled = ativo;
    if (typeof localStorage !== 'undefined') localStorage.setItem('flashEnabled', ativo ? 'true' : 'false');
  }

  // --- Click no no: flash + expansao focal (microscopio) ---
  // Ao clicar num no: o no central CRESCER + 2x, os vizinhos diretos se ESPACAM
  // (puxao para fora em espiral), e o restante se escurece. Simula um microscopio
  // focal: voce aproxima do detalhe e a vizinhaca se expande ao redor.
  function _expandirFoco(id, corGrupo) {
    _destacado = true;
    _tickPausado = true; // pausa a decoracao viva para preservar o foco

    // vizinhos diretos (1 hop) + 2 hop para expansao cascata
    var viz1 = new Set([id]);
    var viz2 = new Set([id]);
    edges.get().forEach(function(e) {
      if (e.from === id) { viz1.add(e.to); }
      if (e.to === id) { viz1.add(e.from); }
    });
    viz1.forEach(function(v1) {
      edges.get().forEach(function(e) {
        if (e.from === v1 && e.to !== id) viz2.add(e.to);
        if (e.to === v1 && e.from !== id) viz2.add(e.from);
      });
    });

    var corViva = clarear(corGrupo || '#89b4fa', 0.4);

    // animacao de expansao: move vizinhos para fora em espiral
    var origPos = {};
    nodes.get().forEach(function(n) {
      if (!viz1.has(n.id) && !viz2.has(n.id)) return;
      origPos[n.id] = network.getPositions([n.id])[n.id] || { x: n.x || 0, y: n.y || 0 };
    });

    var frame = 0, maxFrame = 20;
    var anima = setInterval(function() {
      frame++;
      var t = frame / maxFrame;
      var atualizacoes = [];
      nodes.get().forEach(function(n) {
        if (!viz1.has(n.id) && !viz2.has(n.id) && n.id !== id) {
          // nós fora do foco: esconde, mas mostra leve brilho
          if (frame === 1) {
            atualizacoes.push({
              id: n.id, color: '#14141f', size: 3, opacity: 0.06,
              borderWidth: 0, borderWidthSelected: 0, shadow: false
            });
          }
          return;
        } // <-- fecha if (!viz1.has...

        // nó central: cresce e flutua
        if (n.id === id) {
          var szOrig = original[id] ? original[id].size : 14;
          atualizacoes.push({
            id: id,
            color: corViva,
            borderColor: '#ffffff',
            borderWidth: 4,
            shadow: true,
            shadowColor: corViva,
            shadowSize: 36 + 10 * Math.sin(t * Math.PI),
            size: szOrig + 24 * t
          });
        } else if (viz1.has(n.id)) {
          // vizinhos diretos: se espacam em espiral + crescem
          var op = origPos[n.id];
          var ang = Math.atan2(op.y - (_cacheCentro.y || 0), op.x - (_cacheCentro.x || 0));
          var raio = Math.sqrt(Math.pow(op.x - (_cacheCentro.x || 0), 2) + Math.pow(op.y - (_cacheCentro.y || 0), 2));
          var exp = 28 * t;
          atualizacoes.push({
            id: n.id,
            x: op.x + Math.cos(ang + t * 2) * exp,
            y: op.y + Math.sin(ang + t * 2) * exp,
            color: clarear(corViva, 0.2),
            borderWidth: 2,
            shadow: true,
            shadowSize: 20,
            size: (original[n.id] ? original[n.id].size : 10) + 4 * t
          });
        } else if (viz2.has(n.id)) {
          // vizinhos de 2º: crescem levemente
          atualizacoes.push({ id: n.id, size: (original[n.id] ? original[n.id].size : 8) + 3 * t });
        }
      });

      // esconder arestas que nao conectam ao foco
      var arestasUp = [];
      edges.get().forEach(function(e) {
        if (viz1.has(e.from) && viz1.has(e.to) || viz1.has(e.from) && e.to === id || viz1.has(e.to) && e.from === id) {
          arestasUp.push({ id: e.id, color: corViva, width: 4, opacity: 1 });
        } else {
          arestasUp.push({ id: e.id, color: '#2a2a3a', width: 0.3, opacity: 0.05 });
        }
      });
      nodes.update(atualizacoes);
      edges.update(arestasUp);

      if (frame >= maxFrame) {
        clearInterval(anima);
        // zoom foca no nó central
        if (network.focus) {
          network.focus(id, { scale: 0.9, animation: { duration: 400 } });
        }
      }
    }, 16);
  }

  network.on('click', function(params) {
    if (params.nodes && params.nodes.length > 0) {
      var nid = params.nodes[0];
      if (_flashEnabled) flashNo(nid, _glowCor || '#89b4fa');
      if (!_destacado) {
        _expandirFoco(nid, (original[nid] && original[nid].color) || '#89b4fa');
      }
    }
  });


  // Respeita o estado ATUAL de labels ocultas (so 'false' explicito mostra).
  function _fontLimpo() {
    var oc = (typeof localStorage !== 'undefined' && localStorage.getItem('labelsOcultos') !== 'false');
    return oc ? 0 : 11;
  }
  function limpar() {
    _destacado = false; // libera de volta a decoracao viva (cerebro vivo)
    _flashAtivo = false;
    try { localStorage.removeItem('destGrafo'); } catch (e) {}
    // reseta o estado do motor de avalanches: pausa correntes/residual
    _avalanche = { ativo: false, fila: [], maior: 0, size: 0 };
    _memb = {}; _refrat = {};
    nodes.get().forEach(function(n) { _memb[n.id] = Math.random() * _LIMIAR * 0.7; });
    _sinapsePorNo = null; // forca reconstrucao do cache de vizinhos
    document.querySelectorAll('.lg').forEach(b => b.classList.remove('active'));
    const atualizacoes = nodes.get().map(n => ({
      id: n.id, color: original[n.id].color, size: original[n.id].size,
      opacity: 1, borderWidth: 0, borderWidthSelected: 0, shadow: false,
      font: { size: _fontLimpo(), color: '#cdd6f4', face: 'Segoe UI', bold: false }
    }));
    nodes.update(atualizacoes);
    const arestasUp = edges.get().map(e => ({
      id: e.id, color: arestaOriginal[e.id].color, width: arestaOriginal[e.id].width, opacity: 1
    }));
    edges.update(arestasUp);
    document.getElementById('painel').classList.remove('visivel');
    document.getElementById('painel').innerHTML = '';
  }

  function telaInicial() {
    limpar();
    if (viewInical && network.moveTo) {
      // restaura as posicoes originais dos nos e a visao inicial
      const atualizacoes = Object.keys(posIniciais).map(id => ({
        id, x: posIniciais[id].x, y: posIniciais[id].y, fixed: false
      }));
      nodes.update(atualizacoes);
      network.moveTo({
        position: viewInical,
        scale: scaleInical
      });
      _salvarCamera();
    } else {
      network.fit({ animation: true });
      _salvarCamera();
    }
  }

  function focarVizinhanca(id, corGrupo) {
    _destacado = true; // congela decoracao viva: preserva o efeito do clique
    // vizinhanca direta: nos de 1 pulo
    const viz = new Set([id]);
    edges.get().forEach(e => {
      if (e.from === id) viz.add(e.to);
      if (e.to === id) viz.add(e.from);
    });

    const corNo = clarear(corGrupo, 0.42);
    const corViz = clarear(corGrupo, 0.25);

    // no central: maior, brilhante, glow forte
    // vizinhos: cor viva, borda, glow
    // resto: apagado
    const atualizacoes = [];
    nodes.get().forEach(n => {
      if (n.id === id) {
        atualizacoes.push({
          id: n.id, color: corNo, borderColor: '#ffffff', borderWidth: 4, borderWidthSelected: 4,
          shadow: true, shadowColor: '#ffffff', shadowSize: 28,
          size: original[n.id].size + 16, font: { size: 16, color: '#ffffff', face: 'Segoe UI', bold: true }
        });
      } else if (viz.has(n.id)) {
        atualizacoes.push({
          id: n.id, color: corViz, borderColor: corNo, borderWidth: 2, borderWidthSelected: 2,
          shadow: true, shadowColor: corViz, shadowSize: 16,
          size: original[n.id].size + 6
        });
      } else {
        atualizacoes.push({ id: n.id, color: '#10101a', size: 3, opacity: 0.05,
                            borderWidth: 0, borderWidthSelected: 0, shadow: false, font: { size: 6, color: '#293241' } });
      }
    });
    nodes.update(atualizacoes);

    // arestas da vizinhanca brilhantes; resto apagado
    const arestasUp = [];
    edges.get().forEach(e => {
      const interno = viz.has(e.from) || viz.has(e.to);
      const central = (e.from === id) || (e.to === id);
      if (central) {
        arestasUp.push({ id: e.id, color: corNo, width: 4.5, opacity: 1 });
      } else if (interno) {
        arestasUp.push({ id: e.id, color: corViz, width: 2, opacity: 0.8 });
      } else {
        arestasUp.push({ id: e.id, color: '#2a2a3a', width: 0.3, opacity: 0.06 });
      }
    });
    edges.update(arestasUp);

    // zoom preciso na vizinhanca
    network.fit({
      nodes: Array.from(viz),
      animation: { duration: 600, easingFunction: 'easeInOutQuad' }
    });
  }

  function mostrarLista(grupo, corGrupo, titulo) {
    const painel = document.getElementById('painel');
    const itens = nodes.get()
      .filter(n => grupo.has(n.id))
      .sort((a, b) => (a.label || '').localeCompare(b.label || ''));

    let html = `<h2><span class="dot" style="background:${corGrupo}"></span>${titulo}
      <span class="count">(${itens.length})</span></h2><ul>`;
    itens.forEach(n => {
      const spec = (n.title || '').split('\n')[0];
      html += `<li data-id="${n.id}"><div class="titulo">${n.label}</div>
               <div class="spec">${spec}</div></li>`;
    });
    html += '</ul>';
    painel.innerHTML = html;
    painel.classList.add('visivel');

    // clique no item -> destaca o no + vizinhos e da zoom preciso
    painel.querySelectorAll('li').forEach(li => {
      li.addEventListener('click', () => {
        painel.querySelectorAll('li').forEach(x => x.classList.remove('sel'));
        li.classList.add('sel');
        focarVizinhanca(li.dataset.id, corGrupo);
      });
    });
  }

  function destacar(filtro, valor, corGrupo, semFit) {
    if (filtro === 'home') {
      telaInicial();
      return;
    }
    if (filtro === 'all') {
      limpar();
      return;
    }
    try { localStorage.setItem('destGrafo', JSON.stringify({ f: filtro, v: valor })); } catch (e) {}
    _destacado = true; // congela decoracao viva: preserva o destaque do grupo
    document.querySelectorAll('.lg').forEach(b => b.classList.remove('active'));
    const alvo = document.querySelector(`.lg[data-filter="${filtro}"][data-value="${valor}"]`);
    if (alvo) alvo.classList.add('active');

    // conjunto de nos do grupo
    const grupo = new Set();
    nodes.get().forEach(n => {
      if (filtro === 'cat' && n.cat === valor) grupo.add(n.id);
      else if (filtro === 'cl' && n.cl === valor) grupo.add(n.id);
      else if (filtro === 'st' && n.st === valor) grupo.add(n.id);
      else if (filtro === 'txt') {
        // busca por palavra no label, title (resumo) e tags — case-insensitive
        const termo = String(valor || '').toLowerCase();
        if (!termo) return;
        const alvoTexto =
          String(n.label || '') + ' ' + String(n.title || '') + ' ' +
          String(n.slug || n.id || '') + ' ' + (n.tags || []).join(' ');
        if (alvoTexto.toLowerCase().indexOf(termo) !== -1) grupo.add(n.id);
      }
      else if (filtro === 'dom') {
        const ehMCP = (n.tags || []).some(t => String(t).toLowerCase().indexOf('mcp') !== -1);
        const ehHub = n.cat === 'hub' || n.cat === 'geral';
        // 'mcp' -> notas com tag mcp; 'conhecimento' -> notas sem tag mcp
        // (hubs/categorias genericas nao entram no filtro de dominio)
        if (!ehHub && (valor === 'mcp' ? ehMCP : !ehMCP)) grupo.add(n.id);
      }
    });

    const corViva = clarear(corGrupo, 0.35);

    // nos: dentro do grupo ficam vivos; fora ficam apagados
    const atualizacoes = [];
    nodes.get().forEach(n => {
      if (grupo.has(n.id)) {
        atualizacoes.push({
          id: n.id,
          color: corViva,
          borderColor: '#ffffff',
          borderWidth: 3,
          borderWidthSelected: 3,
          shadow: true,
          shadowColor: corViva,
          shadowSize: 22,
          size: original[n.id].size + 8
        });
      } else {
        atualizacoes.push({ id: n.id, color: '#14141f', size: 3, opacity: 0.08,
                            borderWidth: 0, borderWidthSelected: 0, shadow: false });
      }
    });
    nodes.update(atualizacoes);

    // arestas: entre nos do grupo = cor do grupo e grossas; do grupo p/ fora = finas; fora = apagadas
    const arestasUp = [];
    edges.get().forEach(e => {
      const dentroDentro = grupo.has(e.from) && grupo.has(e.to);
      const dentroFora = grupo.has(e.from) !== grupo.has(e.to);
      if (dentroDentro) {
        arestasUp.push({ id: e.id, color: corViva, width: 3.5, opacity: 0.95 });
      } else if (dentroFora) {
        arestasUp.push({ id: e.id, color: '#888', width: 0.6, opacity: 0.35 });
      } else {
        arestasUp.push({ id: e.id, color: '#3a3a4a', width: 0.3, opacity: 0.10 });
      }
    });
    edges.update(arestasUp);
    if (!semFit) {
      network.fit({ animation: true });
      _salvarCamera();
    }

    // lista dos itens do grupo
    const nome = alvo ? alvo.textContent.trim() : valor;
    mostrarLista(grupo, corGrupo, nome, corGrupo);
  }

  document.querySelectorAll('.lg').forEach(btn => {
    btn.addEventListener('click', () => destacar(btn.dataset.filter, btn.dataset.value, btn.dataset.color));
  });

  // =====================================================================
  // SISTEMA DE TEMAS ESTETICOS (Graph Styler + Graph Background)
  // Presets de um clique: Neon, Glow, Calmo, Padrao
  // Cada tema redefine cores de fundo, glow, sombras, forcas e animacoes
  // =====================================================================
  const TEMAS = {
    padrao: {
      nome: 'Padrao',
      icone: '◉',
      fundo: '#1e1e2e',
      headerBg: '#181825',
      headerBorda: '#313244',
      redeFundo: '#1e1e2e',
      noCor: null,
      arestaCor: '#666',
      sombraCor: 'rgba(137,180,250,0.35)',
      glowCor: '#89b4fa',
      pulsoForca: 1.0,
      pulsoSombra: 1.0,
      destaque: '#cba6f7',
      forca: { grav: -720, central: 0.30, mola: 0.045, amort: 0.82, velMax: 13, delta: 0.32 }
    },
    neon: {
      nome: 'Neon',
      icone: '⚡',
      fundo: '#0d0d1a',
      headerBg: '#0a0a15',
      headerBorda: '#cba6f7',
      statsFundo: '#0d0d1a',
      arestaCor: '#7c3aed',
      sombraCor: 'rgba(203,166,247,0.55)',
      glowCor: '#cba6f7',
      pulsoForca: 2.6,
      pulsoSombra: 2.0,
      respira: '#cba6f7',
      forca: { gravit: -10000, gravidade: 0.12, mola: 0.05, amort: 0.58, velMax: 22, delta: 0.24 }
    },
    glow: {
      nome: 'Glow',
      icone: '☀',
      fundo: '#12121f',
      headerBg: '#101018',
      headerBorda: '#89b4fa',
      statsFundo: '#12121f',
      arestaCor: '#6366f1',
      sombraCor: 'rgba(137,180,250,0.65)',
      glowCor: '#89b4fa',
      pulsoForca: 3.2,
      pulsoSombra: 2.5,
      respira: '#89b4fa',
      forca: { gravit: -560, gravidade: 0.12, mola: 0.043, amort: 0.75, velMax: 11, delta: 0.38 }
    },
    calm: {
      nome: 'Calmo',
      icone: '🌿',
      fundo: '#1a1f1f',
      headerBg: '#141818',
      headerBorda: '#5dade2aa',
      statsFundo: '#1a1f1f',
      arestaCor: '#5dade2',
      sombraCor: 'rgba(93,173,226,0.18)',
      glowCor: '#5dade2',
      pulsoForca: 0.5,
      pulsoSombra: 0.4,
      respira: '#5dade2',
      forca: { gravit: -400, gravidade: 0.08, mola: 0.03, amort: 0.88, velMax: 7, delta: 0.45 }
    }
  };

  // ---- Preset de forcas calibradas por tema ----
  function _aplicarForcasTema(tema) {
    var f = tema.forca;
    _fisBase = {
      gravit: f.gravit,
      central: f.gravidade,
      mola: f.mola,
      amort: f.amort,
      velMax: f.velMax,
      delta: f.delta
    };
    _aplicarForcas(_fisBase);
    // Desestabiliza propositalmente por 600ms
    network.stabilize(50);
  }

  function aplicarTema(nome) {
    var t = TEMAS[nome] || TEMAS.padrao;  // fallback seguro
    try {
      // Fundo do corpo
      document.body.style.background = t.fundo;
      // Header
      var hdr = document.getElementById('header');
      if (hdr) {
        hdr.style.background = t.headerBg || t.fundo;
        hdr.style.borderBottomColor = t.headerBorda || '#313244';
      }

      // Stats
      var stats = document.getElementById('stats');
      if (stats) stats.style.background = t.statsBg || t.fundo;

      // Arestas — cor base
      _corAresta = t.arestaCor;

      // Sombra dos nos 
      _sombraCor = t.sombraCor;
      _glowCor = t.glowCor;

      // Pulsos des crianças
      _pulsoForca = t.pulsoForca;
      _pulsoSombra = t.pulsoSombra;

      // Cor do destaque nos controles internos
      _corDestaque = t.respira || t.glowCor;

      // Cor da barra superior
      _headerCor = t.headerBorda || '#313244';

      // Aplica forcado calibrado
      _aplicarForcasTema(t);
      localStorage.setItem('temaGrafo', nome);
    } catch(e) { }
  }

  // Restaurar tema salvo
  (function() {
    var salvo = localStorage.getItem('temaGrafo') || 'glow';
    aplicarTema(salvo);
  })();

  // =====================================================================
  // RESTORE DE PERSONALIZACOES NO BOOT — filtro ativo + camera (zoom/pane).
  // Roda DEPOIS do enquadramento inicial (~1s) para ele nao sobrescrever a
  // visao salva. O filtro e reaplicado sem fit (semFit); a camera e a fonte
  // de verdade para a visao exata do usuario.
  // =====================================================================
  setTimeout(function() {
    try {
      var dr = localStorage.getItem('destGrafo');
      if (dr) {
        var d = JSON.parse(dr);
        if (d && d.f && d.f !== 'home' && d.f !== 'all') {
          var btn = document.querySelector('.lg[data-filter="' + d.f + '"][data-value="' + d.v + '"]');
          if (btn && btn.dataset.color) destacar(d.f, d.v, btn.dataset.color, true);
        }
      }
    } catch (e) {}
    _restaurarCamera();
  }, 2600);
</script>
